schema_version: "2.0"
document_type: governance_rules_index
natural_language: FORBIDDEN
migration_ids:
  - machine_routing
  - responsibility_model
  - interpretation_layer
  - governance_layout
routes:
  session_state: "docs/rules/session-state.yaml"
layout:
  docs_index: "docs/index.yaml"
  rules_root: "docs/rules"
  template_root: "docs/template"
  responsibility_root: "docs/responsibility"
  policy_root: "docs/policy"
  agent_root: "docs/agent"
  version_root_pattern: "docs/ver{version}"
  history_root_pattern: "docs/ver{version}/history"
  tooling_root: "tools/policy_automatic_engine/governance"
  forbidden_paths:
    - "docs/governance"
    - "policy"
    - "schemas"
  migration_guard:
    forbidden_active_references:
      - "docs/governance/"
      - "policy/registry-policy.json"
      - "schemas/package.schema.json"
      - "schemas/publisher.schema.json"
      - "schemas/submission.schema.json"
      - "schemas/policy.schema.json"
      - "schemas/registry.schema.json"
      - "schemas/registry-head.schema.json"
      - "schemas/registry-snapshot.schema.json"
      - "schemas/registry-distribution-handoff.schema.json"
      - "schemas/trust.schema.json"
    exclude_prefixes:
      - "docs/ver"
    exclude_files:
      - "docs/rules/index.yaml"
tooling:
  entrypoint: "tools/policy_automatic_engine/governance/validate.py"
  requirements: "tools/policy_automatic_engine/governance/requirements.txt"
  package_root: "tools/policy_automatic_engine/governance/validation"
