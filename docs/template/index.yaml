schema_version: "2.0"
document_type: docs_template_index
template_root: "docs/template"
natural_language: FORBIDDEN
responsibility_index: "docs/responsibility/index.yaml"
routes:
  improvement_plan:
    template: "docs/template/improvement_plan.yaml"
    natural_language: FORBIDDEN
  session_document:
    essential:
      template: "docs/template/session_document_template/session_document_essential.yaml"
      natural_language: FORBIDDEN
    types:
      A:
        template: "docs/template/session_document_template/session_type_A.yaml"
        semantic: DECISION
        natural_language: REFERENCE_ONLY
      B:
        template: "docs/template/session_document_template/session_type_B.yaml"
        semantic: IMPLEMENTATION
        natural_language: REFERENCE_ONLY
      C:
        template: "docs/template/session_document_template/session_type_C.yaml"
        semantic: VALIDATION_CLOSEOUT
        natural_language: REFERENCE_ONLY
composition:
  session_document:
    required: [ESSENTIAL, RESPONSIBILITY_MODEL, SESSION_TYPE]
    order: [ESSENTIAL, RESPONSIBILITY_MODEL, SESSION_TYPE]
