goal: >-
  Replace the transitional flat artifact URL shape with a stable structured
  descriptor that separates backend-independent artifact content/integrity from
  authenticated backend-specific delivery location.

design:
  artifact_identity: "(packageId, version, target)"
  package_schema_version: "2.0.0"
  content_authority:
    - "content.filename"
    - "content.sha256"
    - "content.size"
  delivery:
    type: "github-release-asset"
    access_contract: "registry-access-v1"
    locator_fields:
      - "repository"
      - "assetId"
    canonical_repository: "Simple-Connection/sctool-artifacts"
    asset_id_range: "1..9007199254740991"
    expected_release_tag: "sctool/{packageId}/v{version}"
  fail_closed:
    - "unknown delivery.type"
    - "mismatched access contract"
    - "repository policy mismatch"
    - "missing/invalid assetId"
    - "credential/private-key metadata injection"
    - "cross-release or same-name fallback"
    - "retrieved size/hash mismatch"

work_unit_numbering:
  scope: "session-local"
  reset_rule: "Each primary P-session starts at W1."

