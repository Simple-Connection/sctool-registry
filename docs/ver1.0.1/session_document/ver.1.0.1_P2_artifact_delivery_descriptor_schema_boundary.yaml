  delivery_discriminator_contract_approved: true
  delivery_access_contract_reference_approved: true
  delivery_locator_dispatch_boundary_approved: true
  github_locator_implemented: true
  github_repository_policy_constraint_approved: true
  github_asset_id_safe_integer_constraint_approved: true
  github_release_consistency_contract_approved: true
  package_schema_v2_implemented: true
  unknown_backend_machine_enforced: true
  credential_material_machine_rejected: true
  package_consistency_validation_implemented: true
  w4_local_reconstruction_passed: true
  exact_registry_validation_passed: false
  pages_metadata_regression_passed: false
  ptsip_applicable_gates_passed: false
  production_trust_activated: false

state:
  audit: "COMPLETE"
  plan: "APPROVED"
  apply: "IN_PROGRESS"
  test: "LOCAL_RECONSTRUCTION_PASS_EXACT_PENDING"
  closeout: "PENDING"

next:
