schema_version: "1.0.1"
document_type: build_session

session:
  id: "P2"
  number: 2
  title: "artifact_delivery_descriptor_schema_boundary"
  status: "BLOCKED_EXTERNAL_VALIDATION"
  improvement_plan: "docs/ver1.0.1/1.0.1_Improvement_plan.md"
  branch: "dev/1.0.1"
  branch_isolation: false
  authority_repository: "Simple-Connection/sctool-registry"

authority:
  registry_repository: "Simple-Connection/sctool-registry"
  registry_contract: "docs/REGISTRY_CONTRACT_V2.md"
  registry_access_contract: "docs/REGISTRY_ACCESS_V1.md"
  artifact_delivery_contract: "docs/ARTIFACT_DELIVERY_V1.md"
  registry_policy: "policy/registry-policy.json"
  package_schema: "schemas/package.schema.json"
  implementation_repository: "Simple-Connection/sctool-registry"
  authority_rule: >-
    P2 owns Registry metadata/schema/delivery-contract work only. It does not
    assign or migrate lifecycle responsibility inside Kinirin/Simple-Connection.

goal: >-
  Replace the transitional flat artifact URL shape with a stable structured
  descriptor that separates backend-independent artifact content/integrity from
  authenticated backend-specific delivery location.

design:
  artifact_identity: "(packageId, version, target)"
  package_schema_version: "2.0.0"
  content_authority:
    - "content.filename"
    - "content.sha256"
    - "content.size"
  delivery:
    type: "github-release-asset"
    access_contract: "registry-access-v1"
    locator_fields:
      - "repository"
      - "assetId"
    canonical_repository: "Simple-Connection/sctool-artifacts"
    asset_id_range: "1..9007199254740991"
    expected_release_tag: "sctool/{packageId}/v{version}"
  fail_closed:
    - "unknown delivery.type"
    - "mismatched access contract"
    - "repository policy mismatch"
    - "missing/invalid assetId"
    - "credential/private-key metadata injection"
    - "cross-release or same-name fallback"
    - "retrieved size/hash mismatch"

work_unit_numbering:
  scope: "session-local"
  reset_rule: "Each primary P-session starts at W1."

work_units:
  - id: "W1"
    title: "artifact_content_delivery_separation"
    status: "COMPLETE"
    evidence:
      contract: "docs/ARTIFACT_DELIVERY_V1.md"
      implementation_commit: "f75e4e240581e7a0f072268cf7111e2c8cecac46"
      closeout_commit: "60db56ac691f4f7c5955424266766dee6bba179c"
    result:
      - "content and delivery responsibilities separated"
      - "filename/sha256/size remain backend-independent authorities"

  - id: "W2"
    title: "delivery_discriminator_contract"
    status: "COMPLETE"
    evidence:
      contract_commit: "5475ff181716468362371a7f49e701950006cc87"
      closeout_commit: "6ff2e344e4c1c0c00871408a68ebca1f628dcf80"
    result:
      - "delivery.type is sole explicit backend discriminator"
      - "github-release-asset is the only 1.0.1 backend"
      - "delivery.access contains only registry-access-v1 contract reference"
      - "unknown/missing dispatch fails closed"

  - id: "W3"
    title: "github_release_asset_locator"
    status: "COMPLETE"
    evidence:
      contract_commit: "0957ca3c883294d482a408fba26ddf499bf1a104"
      closeout_commit: "8d9ac911cfda86029d196fedcf89a77516fa54e4"
    result:
      - "locator contains repository + assetId only"
      - "repository must equal Registry policy canonical artifact repository"
      - "assetId is a positive JavaScript-safe integer"
      - "release tag is derived from packageId/version and not duplicated"
      - "asset name/size/hash are cross-checked against content authority"

  - id: "W4"
    title: "package_schema_v2_and_validation"
    status: "COMPLETE"
    evidence:
      schema_commit: "f6921b8b0176cf6476e5d66eae80acc413e359c3"
      validator_commit: "20e10b43d5737368c3ec90226730cad8f8aaaef9"
      regression_commit: "83994b1459a04f60163b662cbdc2d8b01621ce0a"
      validator_stability_commit: "cbd7b499822588dc5a976fa2411f4cb19851c6a7"
      closeout_commit: "ebdded02d1e04e024aedf34cefb1e23809504683"
    paths:
      - "schemas/package.schema.json"
      - "tools/validate-registry.py"
      - "tools/test-delivery-package-schema-v2.py"
    result:
      - "package descriptor schema 2.0.0 implemented"
      - "legacy flat url-only artifact rejected"
      - "unknown backend and credential injection rejected"
      - "channel/version/target/repository policy consistency enforced"

  - id: "W5"
    title: "contract_transition_closeout"
    status: "BLOCKED_EXTERNAL_VALIDATION"
    implementation:
      artifact_contract_commit: "26670b5d936d33ff44795ae2f9b1361b5d8dcb38"
      registry_contract_commit: "4b43500d03fa7dc5069315f807078c5b01b6fd11"
    result:
      - "ARTIFACT_DELIVERY_V1 synchronized with implemented schema 2.0.0"
      - "REGISTRY_CONTRACT_V2 transitional flat URL language retired"
      - "structured delivery descriptor adopted as canonical v2 package delivery shape"
      - "exact Registry validation passed"
      - "Pages package-schema-v2 compatibility passed"
      - "PTSIP exact conformance remains externally blocked"

w5_validation:
  executed_at: "2026-08-28"
  reconstruction_method: >-
    Exact dev/1.0.1 blobs were fetched through the GitHub connection and
    reconstructed locally because the execution container cannot resolve
    github.com/raw.githubusercontent.com directly.
  blob_identity_check:
    status: "PASS"
    files_checked: 14
    rule: "local Git blob SHA == dev/1.0.1 GitHub blob SHA"
    files:
      - "schemas/package.schema.json"
      - "schemas/policy-v1.schema.json"
      - "schemas/policy.schema.json"
      - "schemas/publisher.schema.json"
      - "schemas/registry-head.schema.json"
      - "schemas/registry-snapshot.schema.json"
      - "schemas/registry.schema.json"
      - "schemas/submission.schema.json"
      - "schemas/trust.schema.json"
      - "policy/registry-policy.json"
      - "registry.json"
      - "tools/validate-registry.py"
      - "tools/test-delivery-package-schema-v2.py"
      - "tools/validate-pages.py"
  exact_commands:
    - command: "python tools/test-delivery-package-schema-v2.py"
      exit_code: 0
      output: "Package descriptor v2 delivery validation PASS cases=14"
    - command: "python tools/validate-registry.py"
      exit_code: 0
      output: "Registry JSON validation PASS packages=0 publishers=0 trust=inactive"
  pages_compatibility:
    status: "PASS"
    method: >-
      Exact tools/validate-pages.py plus exact package/publisher/head/snapshot/trust
      schemas validated a synthetic signed-metadata envelope containing a valid
      package descriptor schema 2.0.0.
    exit_code: 0
    output: "Pages JSON validation PASS"
    builder_assessment: >-
      tools/build-pages.mjs aggregates complete descriptors and does not interpret
      removed flat artifact transport fields, so no Pages builder code change is
      required for descriptor schema 2.0.0.
  production_trust:
    status: "INACTIVE_UNCHANGED"

external_blocker:
  id: "PTSIP-0.3.6-TOOL-DISTRIBUTION"
  owner_repository: "Kinirin/PTSIP"
  state: "OPEN"
  registry_action_required: false
  evidence:
    registry_workflow_install: "python -m pip install PTSIP==0.3.6"
    registry_dev_branch_actions_runs: 0
    ptsip_tool_release: "tool-v0.3.6"
    ptsip_release_state: "development complete / pre-publication"
    ptsip_bound_specification: "0.3.6-draft @ d6995ed232e845b88d8235b851e80ab54b7804ea"
  reason: >-
    The Registry profile is already 0.3.6-draft, but the Registry Pages workflow
    requires an exact PTSIP==0.3.6 install while upstream Tool 0.3.6 is still at
    its pre-publication boundary. No dev/1.0.1 Actions run exists that could
    supply exact Registry PTSIP validate/conform evidence.
  prohibited_workaround: >-
    Do not downgrade the Registry profile/tool gate to 0.3.5 and do not change
    Registry architecture merely to manufacture a conformance result.
  closeout_requirement: >-
    After PTSIP Tool 0.3.6 becomes available through the approved installation
    path, run the Registry workflow-equivalent PTSIP validate/conform gate on
    the then-current dev/1.0.1 SHA. Record only the resulting evidence if it
    passes; otherwise reopen P2 for the concrete Registry-owned finding.

scope:
  excluded:
    - "Kinirin/Simple-Connection source or PTSIP profile changes"
    - "artifact binary download implementation"
    - "SCTool SDK/CLI download command implementation"
    - "package/channel resolution behavior changes"
    - "production Root trust activation"
    - "trust/trust.json issuance"
    - "publisher submission signature scope changes"
    - "commercial entitlement or per-device authorization"
    - "additional delivery backend activation"

completion_criteria:
  descriptor_common_envelope_approved: true
  delivery_discriminator_contract_approved: true
  github_locator_implemented: true
  package_schema_v2_implemented: true
  unknown_backend_machine_enforced: true
  credential_material_machine_rejected: true
  package_consistency_validation_implemented: true
  exact_registry_validation_passed: true
  pages_metadata_regression_passed: true
  registry_contract_transition_complete: true
  ptsip_applicable_gates_passed: false
  production_trust_activated: false

state:
  audit: "COMPLETE"
  plan: "APPROVED"
  apply: "COMPLETE"
  test: "PASS_WITH_EXTERNAL_PTSIP_PENDING"
  closeout: "BLOCKED_EXTERNAL"

next:
  action: >-
    Freeze P2 Registry-owned implementation. Do not make additional P2 code or
    schema changes solely to bypass upstream PTSIP Tool publication. When the
    approved PTSIP 0.3.6 installation path becomes available, run exact Registry
    PTSIP validation/conformance and close P2 only on PASS evidence.
