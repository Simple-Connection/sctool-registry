    - "program-sdk/sctool-sdk/tests/registry-access.test.mjs"
    - "program-sdk/sctool-sdk/tests/run-registry-access-suite.mjs"
    - "program-sdk/sctool-sdk/package.json"
  desktop_files_changed: false
  simple_connection_product_docs_changed: false

validation:
  exact_package_run:
    received_at: "2026-08-27"
    npm_ci: "PASS"
    typecheck: "PASS"
    build: "PASS"
    registry_access_tests:
      status: "PASS"
      total: 9
      passed: 9
      failed: 0
    sdk_governance_validation: "PASS"
    ptsip_doctor:
      status: "PASS"
      exit_code: 0
    ptsip_validate:
      status: "BLOCKED_EXTERNAL_PROFILE"
      exit_code: 3
      cause: >-
        Kinirin/Simple-Connection's then-current PTSIP project profile used the
        older lifecycle/schema model and was not valid under installed PTSIP
        Tool 0.3.6. Registry does not own that profile migration.
    ptsip_conform:
      status: "BLOCKED_EXTERNAL_PROFILE"
      exit_code: 6
      outcome: "INCOMPLETE"
      cause: "profile.valid=false before conformance evaluation could close"
  security_tests_covered:
    - "authenticated identity + repository read -> authorized"
    - "missing/unexecutable gh -> gh-unavailable"
    - "failed gh auth status -> unauthenticated"
    - "failed/empty gh api user -> identity-unresolved"
    - "repository probe 403 -> access-denied"
    - "repository probe 404 -> access-denied"
    - "transport failure/timeout -> network-unavailable"
    - "inherited GH_TOKEN removed"
    - "inherited GITHUB_TOKEN removed"
    - "gh auth token never invoked"
    - "structured results contain no credential material"

external_blocker:
  id: "SC-PTSIP-0.3.6-LIFECYCLE-CLASSIFICATION"
  owner_repository: "Kinirin/Simple-Connection"
  state: "OPEN"
  registry_action_required: false
  description: >-
    Simple Connection is independently reviewing which PTSIP 0.3.6 lifecycle
    actually owns the repository's SDK/tooling responsibilities before it
    finalizes its 0.3.6 project profile. This may take time and is outside the
    Registry responsibility boundary.
  closeout_requirement: >-
    Accept a later Simple Connection-owned PTSIP validation/conformance result
    showing the relevant SDK plane is valid/conformant. Do not prescribe the
    lifecycle classification from this Registry session.

