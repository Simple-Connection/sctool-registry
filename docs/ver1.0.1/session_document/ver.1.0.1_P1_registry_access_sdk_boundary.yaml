schema_version: "1.0.1"
document_type: build_session

session:
  id: "P1"
  number: 1
  title: "registry_access_sdk_boundary"
  status: "IN_PROGRESS"
  improvement_plan: "docs/ver1.0.1/1.0.1_Improvement_plan.md"
  branch: "dev/1.0.1"
  branch_isolation: false
  authority_repository: "Simple-Connection/sctool-registry"

authority:
  registry_repository: "Simple-Connection/sctool-registry"
  registry_access_contract: "docs/REGISTRY_ACCESS_V1.md"
  registry_contract: "docs/REGISTRY_CONTRACT_V2.md"
  registry_policy: "policy/registry-policy.json"
  implementation_repository: "Kinirin/Simple-Connection"
  implementation_component: "program-sdk/sctool-sdk"
  implementation_branch: "dev/1.0.1"
  product_release_session_owner: false
  authority_rule: >-
    Registry Distribution 1.0.1 P1 owns planning and completion state. The
    Simple Connection repository is only the physical owner of the Program SDK
    implementation and does not receive a new product-version P-session for this
    Registry contract work.

goal: >-
  Implement the SDK-side GitHub identity and private artifact-repository access
  boundary defined by REGISTRY_ACCESS_V1, without depending on Simple Connection
  desktop internals and without exposing or extracting GitHub credential material.

scope:
  allowed_implementation_paths:
    - "program-sdk/sctool-sdk/**"
  allowed_contract_consumption:
    - "REGISTRY_ACCESS_V1 identity and access states"
    - "REGISTRY_CONTRACT_V2 authenticated artifact-access boundary"
  excluded:
    - "desktop/src/**"
    - "renderer/UI changes"
    - "Simple Connection installer UX"
    - "Simple Connection product-version session creation for Registry work"
    - "production Root trust activation"
    - "trust/trust.json issuance"
    - "artifact binary download implementation"
    - "package/channel update resolution"
    - "per-device credentials or application attestation"
    - "commercial entitlement or licensing"

work_units:
  - id: "W5"
    title: "registry_access_types"
    status: "IMPLEMENTED"
    objective: >-
      Define stable SDK result/types for authorized, gh-unavailable,
      unauthenticated, identity-unresolved, access-denied,
      network-unavailable, and configuration-error.
  - id: "W6"
    title: "github_identity_adapter"
    status: "IMPLEMENTED"
    objective: >-
      Resolve the canonical current GitHub login through the GitHub CLI
      credential-store session while removing inherited GH_TOKEN and
      GITHUB_TOKEN overrides from Registry subprocesses.
  - id: "W7"
    title: "artifact_repository_authorization_probe"
    status: "IMPLEMENTED"
    objective: >-
      Probe authenticated read access to Simple-Connection/sctool-artifacts
      and normalize authenticated 403/404 responses to access-denied.
  - id: "W8"
    title: "negative_security_tests"
    status: "IMPLEMENTED_LOCAL_PASS"
    objective: >-
      Prove fail-closed behavior, token-override isolation, non-invocation of
      gh auth token, and absence of credential material from structured results.

behavior_contract:
  identity_provider: "github.com"
  credential_source: "gh-cli-credential-store"
  canonical_identity_command: "gh api user --jq .login"
  authentication_gate: "gh auth status --hostname github.com"
  artifact_repository: "Simple-Connection/sctool-artifacts"
  repository_visibility: "private"
  token_extraction_allowed: false
  client_private_key_required: false
  inherited_token_overrides_allowed: false
  authorization_fail_closed: true
  desktop_runtime_dependency_allowed: false

access_states:
  - "authorized"
  - "gh-unavailable"
  - "unauthenticated"
  - "identity-unresolved"
  - "access-denied"
  - "network-unavailable"
  - "configuration-error"

