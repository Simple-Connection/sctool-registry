schema_version: "1.2"
document_type: registry_client_sdk_distribution_contract
natural_language: FORBIDDEN
contract_id: REGISTRY_CLIENT_SDK_DISTRIBUTION_V1
responsibility: RESP_REGISTRY_CLIENT_SDK_PACKAGE_PUBLICATION
authority: AUTH_REGISTRY_SDK_PACKAGE_DELIVERY
mechanism: NPMJS_PUBLIC_REGISTRY
registry: "https://registry.npmjs.org"
package: "@simple-connection/sctool-registry-client-sdk"
version: "0.2.2"
visibility: PUBLIC
producer:
  repository: "Simple-Connection/sctool-registry"
  package_root: "packages/registry-client-sdk"
  version_source: PACKAGE_JSON
  source_revision_binding: REQUIRED
consumer:
  primary_repository: "Simple-Connection/SC_Linked_App"
  public_consumers: ALLOWED
  authentication: NOT_REQUIRED
  anonymous_installation: REQUIRED
  exact_version_pin: REQUIRED
version_policy:
  dependency_range: EXACT
  caret: FORBIDDEN
  tilde: FORBIDDEN
  mutable_tag_as_build_authority: FORBIDDEN
  lockfile: REQUIRED
publish:
  workflow: ".github/workflows/publish-registry-client-sdk.yml"
  from_ci: REQUIRED
  access: PUBLIC
  pack_before_publish: REQUIRED
  local_integrity_evidence: REQUIRED
  remote_integrity_verification: REQUIRED
  anonymous_remote_verification: REQUIRED
  existing_version:
    integrity_equal: REUSE
    integrity_mismatch: FAIL_CLOSED
authentication:
  publication:
    preferred: NPM_TRUSTED_PUBLISHING_OIDC
    bootstrap: NPM_TOKEN
    source_controlled_token: FORBIDDEN
    github_actions:
      id_token_permission: WRITE
      runner: GITHUB_HOSTED
      node_major: 24
      npm_minimum: "11.5.1"
  consumer:
    required: false
    token: FORBIDDEN_AS_REQUIREMENT
trusted_publisher:
  provider: GITHUB_ACTIONS
  repository: "Simple-Connection/sctool-registry"
  workflow_filename: "publish-registry-client-sdk.yml"
  allowed_action: NPM_PUBLISH
ownership_transition:
  package_scope: "@simple-connection"
  package_identity_change: FORBIDDEN
  consumer_access_revalidation: NOT_APPLICABLE_PUBLIC_PACKAGE
