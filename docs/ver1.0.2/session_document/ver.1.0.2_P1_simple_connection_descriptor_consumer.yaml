schema_version: "1.0.2"
document_type: build_session

session:
  id: "P1"
  number: 1
  title: "simple_connection_descriptor_consumer"
  status: "IN_PROGRESS"
  improvement_plan: "docs/ver1.0.2/1.0.2_Improvement_plan.md"
  branch: "dev/1.0.2"
  branch_isolation: false
  authority_repository: "Simple-Connection/sctool-registry"

authority:
  registry_repository: "Simple-Connection/sctool-registry"
  registry_baseline: "c3e881742177aec3eae71d2c336801b6b52c74e5"
  registry_contract: "docs/REGISTRY_CONTRACT_V2.md"
  registry_access_contract: "docs/REGISTRY_ACCESS_V1.md"
  artifact_delivery_contract: "docs/ARTIFACT_DELIVERY_V1.md"
  registry_policy: "policy/registry-policy.json"
  package_schema: "schemas/package.schema.json"
  implementation_repository: "Kinirin/Simple-Connection"
  implementation_branch: "dev/2.2.4"
  implementation_reviewed_head: "6a857789159a4f1e6ae8ca5535b8be01c9377141"
  implementation_session: "P2"
  implementation_plan: "docs/v2.2/v2.2.4/session_document/P2_plan.yaml"
  authority_rule: >-
    Registry owns canonical contract provenance and conformance evidence. Simple
    Connection owns the consumer implementation, local install/runtime behavior,
    source-path approval, and its own PTSIP lifecycle declarations. Registry must
    not modify the Simple Connection PTSIP profile or desktop lifecycle policy.

goal: >-
  Establish a typed, deterministic, fail-closed Simple Connection consumer for
  Registry package descriptor schema 2.0.0, preserving Registry package/content/
  delivery authority without performing artifact download, installation, or activation.

contract:
  package_schema_version: "2.0.0"
  immutable_identity: "(packageId, version, target)"
  version_resolution:
    - "defaultChannel"
    - "channels"
    - "versions"
  target_key: "target.platform + '-' + target.arch"
  content_authority:
    - "content.filename"
    - "content.sha256"
    - "content.size"
  delivery:
    supported_type: "github-release-asset"
    discriminator: "delivery.type"
    access_contract: "registry-access-v1"
    repository: "Simple-Connection/sctool-artifacts"
    locator_fields:
      - "repository"
      - "assetId"
    asset_id_range: "1..9007199254740991"
  fail_closed:
    - "unsupported schema version"
    - "malformed or structurally unknown descriptor fields"
    - "missing default channel"
    - "channel points to absent version"
    - "target key mismatch or target absent"
    - "unsupported delivery type"
    - "access contract mismatch"
    - "artifact repository mismatch"
    - "invalid assetId"
    - "invalid SHA-256 or content size"
    - "legacy flat URL/assetName transport shape"
    - "credential fields injected into access/locator"
  forbidden_fallbacks:
    - "generic HTTPS"
    - "cross-release lookup"
    - "same-name artifact lookup"
    - "anonymous artifact retrieval"

scope:
  included:
    - "Simple Connection SCTool SDK current-boundary audit"
    - "typed package descriptor v2 consumer model"
    - "channel/version/target resolution"
    - "content/delivery boundary preservation"
    - "fail-closed contract validation and regression tests"
  excluded:
    - "GitHub Release exact asset lookup"
    - "artifact binary download"
    - "local artifact installation"
    - "package activation or rollback"
    - "renderer/UI changes"
    - "legacy canonical repository sync removal"
    - "Simple Connection PTSIP profile/classification edits by Registry"
    - "production Root trust activation"

work_unit_numbering:
  scope: "session-local"
  reset_rule: "Each primary P-session starts at W1."

work_units:
  - id: "W1"
    title: "current_sdk_boundary_audit_and_path_proposal"
    status: "COMPLETE_PENDING_PATH_APPROVAL"
    evidence:
      simple_connection_head: "6a857789159a4f1e6ae8ca5535b8be01c9377141"
      sdk_root: "program-sdk/sctool-sdk"
      existing_source_files:
        - "src/index.ts"
        - "src/host-capabilities.ts"
        - "src/localization.ts"
        - "src/registry-access.ts"
      existing_registry_access: "src/registry-access.ts"
      existing_test_pattern: "tests/*.test.mjs + tests/run-*-suite.mjs"
      policy: "docs/policy/policy_2.yaml#V22-PATH-001"
    result:
      reuse:
        - "registry-access.ts remains the sole GitHub identity/authorization boundary"
        - "existing SCTool SDK package/test conventions are reused"
      do_not_reuse_for_descriptor_logic:
        - "src/index.ts: SCTool manifest/environment contract; avoid mixing Registry distribution semantics"
        - "src/registry-access.ts: authentication/authorization only; do not mix descriptor parsing/resolution"
      proposed_new_paths:
        - "program-sdk/sctool-sdk/src/registry-package.ts"
        - "program-sdk/sctool-sdk/tests/registry-package.test.mjs"
        - "program-sdk/sctool-sdk/tests/run-registry-package-suite.mjs"
      proposed_modified_paths:
        - "program-sdk/sctool-sdk/package.json"
    gate:
      state: "BLOCKED_USER_PATH_APPROVAL"
      reason: >-
        Simple Connection active policy V22-PATH-001 requires explicit approval
        before an unlisted new source path is created.

  - id: "W2"
    title: "descriptor_type_contract"
    status: "BLOCKED_BY_W1_PATH_APPROVAL"

  - id: "W3"
    title: "channel_version_target_resolution"
    status: "BLOCKED_BY_W2"

  - id: "W4"
    title: "content_delivery_boundary"
    status: "BLOCKED_BY_W2"

  - id: "W5"
    title: "negative_contract_validation"
    status: "BLOCKED_BY_W3_W4"

path_approval_request:
  owner_repository: "Kinirin/Simple-Connection"
  policy_id: "V22-PATH-001"
  state: "PENDING_USER_APPROVAL"
  new_paths:
    - path: "program-sdk/sctool-sdk/src/registry-package.ts"
      purpose: "Registry package descriptor v2 typed parser and deterministic resolver"
    - path: "program-sdk/sctool-sdk/tests/registry-package.test.mjs"
