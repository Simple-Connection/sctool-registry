schema_version: "1.0.2"
document_type: build_session

session:
  id: "P1"
  number: 1
  title: "registry_client_sdk_responsibility_boundary"
  status: "IN_PROGRESS"
  improvement_plan: "docs/ver1.0.2/1.0.2_Improvement_plan.md"
  branch: "dev/1.0.2"
  authority_repository: "Simple-Connection/sctool-registry"

authority:
  registry_repository: "Simple-Connection/sctool-registry"
  registry_baseline: "c3e881742177aec3eae71d2c336801b6b52c74e5"
  simple_connection_repository: "Kinirin/Simple-Connection"
  simple_connection_branch: "dev/2.2.4"
  reviewed_simple_connection_head: "6a857789159a4f1e6ae8ca5535b8be01c9377141"
  registry_contract: "docs/REGISTRY_CONTRACT_V2.md"
  registry_access_contract: "docs/REGISTRY_ACCESS_V1.md"
  artifact_delivery_contract: "docs/ARTIFACT_DELIVERY_V1.md"
  package_schema: "schemas/package.schema.json"

decision:
  sdk_model: "TWO_SDK"
  reason:
    - "SCTool authoring and Registry consumption have different users and lifecycle ownership."
    - "Authoring SDK produces and validates developer-owned .sctool packages."
    - "Registry Client SDK integrates Simple Connection with Registry discovery/access/delivery."
  authoring_sdk:
    repository: "Kinirin/Simple-Connection"
    path: "program-sdk/sctool-sdk"
    responsibility:
      - "coding-agent/developer SCTool authoring guidance"
      - "manifest/build/test/package support"
      - "developer tool -> .sctool production"
    forbidden_long_term_responsibility:
      - "Registry artifact authorization"
      - "Registry descriptor/channel resolution"
      - "Registry artifact download/update client behavior"
  registry_client_sdk:
    repository: "Simple-Connection/sctool-registry"
    proposed_path: "packages/registry-client-sdk"
    responsibility:
      - "Registry metadata consumer types"
      - "registry-access-v1 implementation"
      - "package descriptor parsing and deterministic resolution"
      - "delivery backend resolution"
      - "authenticated artifact retrieval"
      - "artifact content integrity verification"
      - "Simple Connection integration-facing update candidate API"
    forbidden_responsibility:
      - "SCTool scaffold/build/sign/package authoring"

ownership_correction:
  historical_source:
    repository: "Kinirin/Simple-Connection"
    sdk_path: "program-sdk/sctool-sdk"
    misplaced_registry_client_paths:
      - "src/registry-access.ts"
      - "cli/lib/github-registry-access.mjs"
      - "tests/registry-access.test.mjs"
      - "tests/run-registry-access-suite.mjs"
    package_export: "./registry-access"
  migration_rule: >-
    Preserve Distribution 1.0.1 evidence, but move Registry client ownership into
    the Registry Client SDK during 1.0.2. Remove the duplicated Registry access
    surface from the Simple Connection Authoring SDK only after the Registry Client
    SDK replacement is implemented and Simple Connection integration has migrated.
  destructive_change_now: false

packages_namespace:
  current_contract:
    descriptor_path: "packages/{packageId}.json"
    evidence: "packages/README.md"
  conflict: >-
    Current repository documentation says only accepted package descriptors belong
    under packages/. A client SDK under packages/ therefore requires an explicit
    layout exception/clarification and PTSIP component assignment.
  proposed_layout:
    descriptors: "packages/{packageId}.json"
    registry_client_sdk: "packages/registry-client-sdk/**"
  validator_observation: >-
    tools/validate-registry.py validates package descriptors by following the paths
    referenced from registry.json; it does not treat every packages/** path as a
    descriptor automatically.

work_units:
  - id: "W1"
    title: "sdk_responsibility_reassessment"
    status: "COMPLETE"
    evidence:
      - "Simple Connection authoring SDK package exports include Registry access despite authoring responsibility."
      - "Registry packages/ currently contains descriptor README only."
      - "Registry validator follows registry.json descriptor paths rather than recursively parsing packages/**."
    result:
      - "Previous proposal to add Registry descriptor consumer code to Kinirin/Simple-Connection/program-sdk/sctool-sdk is WITHDRAWN."
      - "Two-SDK model selected."
      - "Registry access implementation identified as 1.0.2 migration responsibility."

  - id: "W2"
    title: "registry_client_sdk_path_and_component_approval"
    status: "PENDING_USER_APPROVAL"
    proposal:
      path: "packages/registry-client-sdk/**"
      package_name: "@simple-connection/sctool-registry-sdk"
      required_same_change_updates:
        - "packages/README.md"
        - "ptsip.yaml"
        - "AGENTS.md responsibility boundary"
    completion:
      - "exact SDK path approved"
      - "packages descriptor namespace remains unambiguous"
      - "new PTSIP component lifecycle ownership defined"

  - id: "W3"
    title: "registry_access_migration"
    status: "BLOCKED_BY_W2"
    source:
      - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/src/registry-access.ts"
      - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/cli/lib/github-registry-access.mjs"
      - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/tests/registry-access.test.mjs"
      - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/tests/run-registry-access-suite.mjs"
    target: "packages/registry-client-sdk"
    rule: "behavior-preserving migration before source removal"

  - id: "W4"
    title: "descriptor_and_update_candidate_client_boundary"
    status: "BLOCKED_BY_W3"
    scope:
      - "package schema 2.0.0 typed model"
      - "defaultChannel/channels/versions resolution"
      - "target/content/delivery fail-closed validation"
      - "normalized Registry update candidate"

  - id: "W5"
    title: "simple_connection_integration_handoff"
    status: "BLOCKED_BY_W4"
    scope:
      - "define Simple Connection consumption surface"
      - "remove Registry client exports from Authoring SDK after migration"
      - "preserve Authoring SDK build/test/package responsibility"
      - "record exact integration evidence"

withdrawn_previous_path_request:
  state: "WITHDRAWN"
  paths:
    - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/src/registry-package.ts"
    - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/tests/registry-package.test.mjs"
    - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/tests/run-registry-package-suite.mjs"
    - "Kinirin/Simple-Connection/program-sdk/sctool-sdk/package.json Registry consumer export modification"
  reason: "Would mix Registry consumer responsibility into the SCTool Authoring SDK."

verification:
  state: "ARCHITECTURE_ONLY"
  required_after_W2:
    - "Registry PTSIP doctor/inspect before path change"
    - "Registry Client SDK typecheck/build/tests"
    - "Registry access regression"
    - "Registry descriptor regression"
    - "Registry PTSIP validate/conform after change"
    - "Registry JSON validation"
    - "Simple Connection integration validation after handoff"

state:
  audit: "COMPLETE"
  plan: "CORRECTED"
  apply: "BLOCKED_EXACT_PATH_APPROVAL"
  test: "NOT_RUN"
  closeout: "INCOMPLETE"

next:
  action: >-
    Obtain approval for packages/registry-client-sdk/** as the Registry-owned
    Simple Connection integration SDK path. After approval, materialize the SDK
    together with packages/README.md, AGENTS.md and ptsip.yaml responsibility
    updates in one architecture commit. Do not remove the Simple Connection
    registry-access implementation until replacement integration is proven.