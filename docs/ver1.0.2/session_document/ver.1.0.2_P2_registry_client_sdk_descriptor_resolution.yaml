objective:
  code: "descriptor_channel_version_target_resolution"
  summary: >-
    Implement the Registry-owned consumer boundary that validates package descriptor
    schema 2.0.0 inputs and deterministically resolves channel, version, and target
    metadata without performing artifact backend lookup or retrieval.

scope:
  in:
    - "Package descriptor schemaVersion 2.0.0 runtime validation"
    - "required root field and additional-property validation"
    - "semantic-version key/value validation required by the descriptor contract"
    - "defaultChannel and explicit channel resolution"
    - "channel version existence validation"
    - "explicit version resolution"
    - "platform/arch target key derivation and exact artifact selection"
    - "artifact map key == target.platform-target.arch consistency validation"
    - "content filename/sha256/size authority preservation"
    - "delivery.type/access/locator structural preservation"
    - "Registry policy checks required to interpret the current github-release-asset descriptor"
    - "fail-closed unsupported/malformed descriptor behavior"
    - "public Registry Client SDK exports and regression tests for the above"
  out:
    - "GitHub Release lookup"
    - "release tag API resolution"
    - "GitHub Release asset ID lookup against a live backend"
    - "authenticated artifact download"
    - "downloaded byte-length verification"
    - "downloaded SHA-256 verification"
    - "normalized update candidate API"
    - "Simple Connection integration"
    - "removal of the historical Registry access surface from Kinirin/Simple-Connection"
    - "install/activation/rollback/runtime/UI policy"
    - "SCTool scaffold/build/test/sign/package authoring"
    - "production Root trust activation"

contract_rules:
  descriptor:
    schema_version: "2.0.0"
    required_root:
      - "schemaVersion"
      - "id"
      - "publisher"
      - "defaultChannel"
      - "channels"
      - "versions"
    additional_properties: "FAIL_CLOSED"
  resolution:
    default_channel: "descriptor.defaultChannel -> descriptor.channels[channel]"
    explicit_channel: "descriptor.channels[channel]"
    explicit_version: "descriptor.versions[version]"
    target_key: "platform + '-' + arch"
    target_consistency: "artifact map key must equal artifact.target.platform + '-' + artifact.target.arch"
    fallback: "FORBIDDEN"
  artifact_authority:
    content:
      - "filename"
      - "sha256"
      - "size"
    delivery_discriminator: "delivery.type"
    allowed_delivery_type: "github-release-asset"
    access_contract: "registry-access-v1"
    policy_repository: "Simple-Connection/sctool-artifacts"
    note: >-
      P2 validates and preserves delivery metadata but does not resolve the GitHub
      Release or retrieve artifact bytes.

