    - id: PRODUCT_INSTALL_REGISTRY_NON_ATOMIC
      path: "desktop/src/main/features/mcp/sctool/store.ts"
      observed:
        - REGISTRY_JSON_WRITE_USES_WRITE_FILE_SYNC
        - INSTALL_RECORD_CONTAINS_ENABLED_FIELD
    - id: PRODUCT_SELECTION_SEPARATE_STORE
      path: "desktop/src/main/features/mcp/sctool/selection-store.ts"
      observed:
        - SELECTED_VERSION_HAS_SEPARATE_ATOMIC_STORE
        - ACTIVATION_SELECTION_IS_PRODUCT_STATE
    - id: PRODUCT_VERSIONED_INSTALL_ROOT
      path: "desktop/src/main/features/mcp/sctool/paths.ts"
      observed:
        - INSTALL_ROOT_PACKAGES_ID_VERSION
        - SELECTED_VERSION_STORE_SEPARATE_FROM_PACKAGE_TREE
    - id: REGISTRY_SDK_NOT_CONSUMED_BY_PRODUCT
      path: "desktop/package.json"
      observed:
        - REGISTRY_CLIENT_SDK_DEPENDENCY_ABSENT
        - REGISTRY_CLIENT_SDK_CURRENTLY_PRIVATE
boundary:
  input:
    contract: CONTRACT_UPDATE_CANDIDATE_V1
    resolution_state: UPDATE_AVAILABLE
    candidate_type: VERIFIED_UPDATE_CANDIDATE
    artifact_access: VERIFIED_ARTIFACT_LEASE
  output:
    state: INSTALLED_NOT_ACTIVATED
    persistent_owner: AUTH_SIMPLE_CONNECTION_DESKTOP
    package_identity:
      - packageId
      - version
    persistent_artifacts:
      - VERSIONED_INSTALL_DIRECTORY
      - INSTALLED_PACKAGE_RECORD
  install_semantics:
    initial_install: DEFERRED_SEPARATE_DECISION
    update_install: IN_SCOPE
    side_by_side_versions: PRESERVE
    new_update_enabled_compatibility_value: false
    selected_version_mutation: FORBIDDEN
    runtime_descriptor_mutation: FORBIDDEN
    runtime_rescan: FORBIDDEN
    activation: FORBIDDEN
    rollback: FORBIDDEN
    renderer_ui: FORBIDDEN
  handoff_invariants:
    - VERIFIED_ARTIFACT_LEASE_ONLY
    - RAW_REGISTRY_STAGING_PATH_FORBIDDEN
    - CONTENT_FILENAME_NOT_FILESYSTEM_AUTHORITY
    - EXTRACTED_MANIFEST_PACKAGE_ID_EQUALS_CANDIDATE_PACKAGE_ID
    - EXTRACTED_MANIFEST_VERSION_EQUALS_CANDIDATE_VERSION
    - INTERNAL_PACKAGE_CHECKSUMS_PASS
    - CANDIDATE_LEASE_DISPOSED_ON_ALL_TERMINAL_PATHS
  persistence_invariants:
    - PRODUCT_CONTROLLED_TRANSACTION_ROOT
    - SAME_FILESYSTEM_AS_FINAL_INSTALL_ROOT
    - EXISTING_FINAL_DIRECTORY_NEVER_PREDELETED
    - FINAL_DIRECTORY_PUBLISHED_BY_RENAME
    - INSTALL_REGISTRY_WRITTEN_ATOMICALLY
    - PARTIAL_TRANSACTION_NOT_VISIBLE_AS_INSTALLED
    - FAILURE_CLEANUP_REQUIRED
    - CRASH_RECOVERY_DETERMINISTIC
    - SAME_ID_VERSION_REINSTALL_IDEMPOTENT_OR_CONFLICT
    - EXISTING_SIBLING_VERSIONS_PRESERVED
responsibility_migration:
  approval: APPROVED
  option: R1
  source:
    id: RESP_SIMPLE_CONNECTION_INSTALL
    state: CURRENT_BROAD_RESPONSIBILITY
    action_before_implementation: DECOMPOSE
  approved:
    - id: RESP_SIMPLE_CONNECTION_INSTALL_INTENT
      subject: AUTH_SIMPLE_CONNECTION_DESKTOP
      authority_domain: LOCAL_INSTALLATION
      lifecycle_phase: INSTALLATION
      operation: DECIDE
      object_class: INSTALL_INTENT
      relation: PRODUCES
      boundary: ELIGIBLE_CANDIDATE_TO_EXPLICIT_INSTALL_INTENT
    - id: RESP_SIMPLE_CONNECTION_INSTALL_TRANSACTION_LIFECYCLE
      subject: AUTH_SIMPLE_CONNECTION_DESKTOP
      authority_domain: LOCAL_INSTALLATION
      lifecycle_phase: INSTALLATION
      operation: CONTROL_LIFECYCLE
      object_class: INSTALL_TRANSACTION
      relation: OWNS
      boundary: CREATE_ABORT_RECOVER_COMPLETE_INSTALL_TRANSACTION
    - id: RESP_SIMPLE_CONNECTION_PACKAGE_MATERIALIZATION
      subject: AUTH_SIMPLE_CONNECTION_DESKTOP
      authority_domain: LOCAL_INSTALLATION
      lifecycle_phase: INSTALLATION
      operation: MATERIALIZE
      object_class: INSTALLED_PACKAGE_TREE
      relation: PRODUCES
      boundary: VERIFIED_ARTIFACT_STREAM_TO_VALIDATED_PRODUCT_STAGING_TREE
    - id: RESP_SIMPLE_CONNECTION_INSTALL_STATE_COMMIT
      subject: AUTH_SIMPLE_CONNECTION_DESKTOP
      authority_domain: LOCAL_INSTALLATION
      lifecycle_phase: INSTALLATION
      operation: COMMIT
      object_class: LOCAL_INSTALL_STATE
      relation: OWNS
      boundary: VALIDATED_STAGING_TREE_TO_ATOMIC_PERSISTENT_INSTALL_STATE
  vocabulary_changes_required:
    operation:
      - DECIDE
      - MATERIALIZE
      - COMMIT
    object_class:
      - INSTALL_INTENT
      - INSTALL_TRANSACTION
      - INSTALLED_PACKAGE_TREE
  migration_target:
    source_responsibility: RESP_SIMPLE_CONNECTION_INSTALL
    target_state_after_proof: RETIRED_OR_COMPATIBILITY_ALIAS
    approval_required: P5_IMPLEMENTATION_APPROVAL
sdk_distribution:
  option: S1
  mechanism: GITHUB_PACKAGES
  registry: "https://npm.pkg.github.com"
  package: "@simple-connection/sctool-registry-client-sdk"
  visibility: PRIVATE
  producer:
    repository: "Simple-Connection/sctool-registry"
    owner: Simple-Connection
    authority: SDK_SOURCE_AND_PACKAGE_PUBLICATION
  consumer:
    current_repository: "Simple-Connection/SC_Linked_App"
    current_owner: Simple-Connection
    target_repository_after_ownership_transfer: "Simple-Connection/SC_Linked_App"
    target_owner: Simple-Connection
    authority: PACKAGE_READ_ONLY
  version_policy:
    dependency_range: EXACT
    caret: FORBIDDEN
    tilde: FORBIDDEN
    lockfile: REQUIRED
    mutable_tags_as_build_authority: FORBIDDEN
  publish_policy:
    source_revision_binding: REQUIRED
    package_version_unique: REQUIRED
    package_integrity_evidence: REQUIRED
    package_provenance_evidence: REQUIRED
    publish_from_ci: REQUIRED
  authentication:
    ci_preference:
      - PACKAGE_REPOSITORY_ACCESS_WITH_GITHUB_TOKEN
      - READ_PACKAGES_CREDENTIAL_FALLBACK
    local_development:
      source_controlled_token: FORBIDDEN
      environment_or_user_config_credential: REQUIRED
  ownership_transition:
    package_scope_stable: "@simple-connection"
    package_identity_changes_on_consumer_transfer: false
    consumer_access_revalidation_after_transfer: REQUIRED
  archival:
    github_release_tgz: OPTIONAL
    github_release_tgz_role: PROVENANCE_OR_RECOVERY_ONLY
    primary_dependency_distribution: GITHUB_PACKAGES

sctool_authoring_sdk_ownership:
  approval: APPROVED
  authority_repository: "Simple-Connection/sctool-registry"
  canonical_source_path: "packages/sctool-sdk"
  package: "@simple-connection/sctool-sdk"
  responsibilities:
    - RESP_SCTOOL_AUTHORING_GUIDANCE
    - RESP_SCTOOL_MANIFEST_VALIDATION
    - RESP_SCTOOL_PACKAGE_BUILD
    - RESP_SCTOOL_PACKAGE_TEST
  predecessor:
    repository: "Simple-Connection/SC_Linked_App"
    path: "program-sdk/sctool-sdk"
    state: TRANSITIONAL_MIGRATION_SOURCE
  consumer_boundary:
    repository: "Simple-Connection/SC_Linked_App"
    role: LOCATOR_AND_READ_ONLY_CONSUMER
    source_ownership: FORBIDDEN
    version_authority: FORBIDDEN
    compatibility_authority: FORBIDDEN
    publication_authority: FORBIDDEN
  physical_migration:
    state: PENDING
    rule: AUTHORITY_TRANSFER_PRECEDES_SOURCE_MATERIALIZATION_AND_CONSUMER_REBIND

transaction_model:
  proposed_contract_id: SIMPLE_CONNECTION_INSTALL_TRANSACTION_V1
  states:
    - INTENT_ACCEPTED
    - MATERIALIZING
    - VALIDATED
    - COMMITTING
    - INSTALLED
    - ABORTED
  terminal_states:
    - INSTALLED
    - ABORTED
  transitions:
    - {from: INTENT_ACCEPTED, to: MATERIALIZING, owner: RESP_SIMPLE_CONNECTION_INSTALL_TRANSACTION_LIFECYCLE}
    - {from: MATERIALIZING, to: VALIDATED, owner: RESP_SIMPLE_CONNECTION_PACKAGE_MATERIALIZATION}
    - {from: VALIDATED, to: COMMITTING, owner: RESP_SIMPLE_CONNECTION_INSTALL_STATE_COMMIT}
    - {from: COMMITTING, to: INSTALLED, owner: RESP_SIMPLE_CONNECTION_INSTALL_STATE_COMMIT}
  failure_transition:
    to: ABORTED
    owner: RESP_SIMPLE_CONNECTION_INSTALL_TRANSACTION_LIFECYCLE
  recovery:
    persistent_journal: REQUIRED
    markers:
      - PREPARED
      - FILES_COMMITTED
      - STATE_COMMITTED
    policy: DETERMINISTIC_FORWARD_OR_ROLLBACK
