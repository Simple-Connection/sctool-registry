baseline:
  registry_head: "2bb760a31015780fb29f9b1ef7a1860a559e4dd4"
  registry_input_contract: CONTRACT_UPDATE_CANDIDATE_V1
  registry_input_state: UPDATE_AVAILABLE
  registry_candidate_type: VERIFIED_UPDATE_CANDIDATE
  registry_artifact_access: VERIFIED_ARTIFACT_LEASE
  product_observations:
    - id: PRODUCT_INSTALLER_COUPLED
      path: "desktop/src/main/features/mcp/sctool/installer.ts"
      observed:
