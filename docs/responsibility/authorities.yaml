schema_version: "1.0"
document_type: authority_registry
natural_language: FORBIDDEN
repositories:
  SCTOOL_REGISTRY:
    locator: "Simple-Connection/sctool-registry"
    scope: INTERNAL
  SIMPLE_CONNECTION:
    locator: "Simple-Connection/SC_Linked_App"
    scope: EXTERNAL
  SCTOOL_ARTIFACTS:
    locator: "Simple-Connection/sctool-artifacts"
    scope: EXTERNAL
components:
  COMP_REGISTRY_CLIENT_SDK:
    repository_id: SCTOOL_REGISTRY
    path: "packages/registry-client-sdk"
    ptsip_component: registry-client-sdk
    lifecycle_classification: PRODUCT
  COMP_REGISTRY_SDK_PACKAGE_DELIVERY:
    repository_id: SCTOOL_REGISTRY
    path: ".github/workflows/publish-registry-client-sdk.yml"
    ptsip_component: registry-sdk-package-delivery
    lifecycle_classification: DELIVERY
  COMP_REGISTRY_CONTRACTS:
    repository_id: SCTOOL_REGISTRY
    path: "docs"
    ptsip_component: registry-contracts
    lifecycle_classification: NEUTRAL_CONTRACT
  COMP_REGISTRY_ISSUE_ROUTING:
    repository_id: SCTOOL_REGISTRY
    path: "tools/issue-routing"
    ptsip_component: registry-issue-routing
    lifecycle_classification: PRODUCT
  COMP_SCTOOL_AUTHORING_SDK:
    repository_id: SCTOOL_REGISTRY
    path: "packages/sctool-sdk"
    ptsip_component: sctool-authoring-sdk
    lifecycle_classification: PRODUCT
  COMP_REPOSITORY_TOOL_AUTHORING_SDK:
    repository_id: SCTOOL_REGISTRY
    path: "packages/repository-tool-sdk"
    ptsip_component: repository-tool-authoring-sdk
    lifecycle_classification: PRODUCT
  COMP_AUTHORING_SDK_PACKAGE_DELIVERY:
    repository_id: SCTOOL_REGISTRY
    path: ".github/workflows/publish-authoring-sdks.yml"
    ptsip_component: authoring-sdk-package-delivery
    lifecycle_classification: DELIVERY
  COMP_SCTOOL_AUTHORING_SDK_LEGACY:
    repository_id: SIMPLE_CONNECTION
    path: "program-sdk/sctool-sdk"
    ptsip_component: null
    lifecycle_classification: EXTERNAL_PRODUCT
  COMP_REPOSITORY_TOOL_AUTHORING_SDK_LEGACY:
    repository_id: SIMPLE_CONNECTION
    path: "program-sdk/repository-tool-sdk"
    ptsip_component: null
    lifecycle_classification: EXTERNAL_PRODUCT
  COMP_SIMPLE_CONNECTION_DESKTOP:
    repository_id: SIMPLE_CONNECTION
    path: "."
    ptsip_component: null
    lifecycle_classification: EXTERNAL_PRODUCT
authorities:
  AUTH_REGISTRY_CLIENT_SDK:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_REGISTRY_CLIENT_SDK
  AUTH_REGISTRY_SDK_PACKAGE_DELIVERY:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_REGISTRY_SDK_PACKAGE_DELIVERY
  AUTH_REGISTRY_CONTRACTS:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_REGISTRY_CONTRACTS
  AUTH_REGISTRY_ISSUE_ROUTING:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_REGISTRY_ISSUE_ROUTING
  AUTH_SCTOOL_AUTHORING_SDK:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_SCTOOL_AUTHORING_SDK
  AUTH_SCTOOL_AUTHORING_SDK_LEGACY:
    repository_id: SIMPLE_CONNECTION
    component_id: COMP_SCTOOL_AUTHORING_SDK_LEGACY
  AUTH_REPOSITORY_TOOL_AUTHORING_SDK:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_REPOSITORY_TOOL_AUTHORING_SDK
  AUTH_REPOSITORY_TOOL_AUTHORING_SDK_LEGACY:
    repository_id: SIMPLE_CONNECTION
    component_id: COMP_REPOSITORY_TOOL_AUTHORING_SDK_LEGACY
  AUTH_AUTHORING_SDK_PACKAGE_DELIVERY:
    repository_id: SCTOOL_REGISTRY
    component_id: COMP_AUTHORING_SDK_PACKAGE_DELIVERY
  AUTH_SIMPLE_CONNECTION_DESKTOP:
    repository_id: SIMPLE_CONNECTION
    component_id: COMP_SIMPLE_CONNECTION_DESKTOP
