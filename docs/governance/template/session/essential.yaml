schema_version: "3.0"
document_type: session_document_template
template_id: session_document_essential_v3
natural_language: FORBIDDEN
required_sections: [session, routing, heads, responsibility_model, work_units, evidence, gates, state]
session:
  id: "<SESSION_ID>"
  type: "<A|B|C>"
  number: "<INTEGER>"
  approval: "<APPROVED|REQUIRED|REJECTED>"
  distribution_contract_version: "<SEMVER>"
  branch: "dev/<SEMVER>"
  authority_repository: "<OWNER/REPOSITORY>"
  improvement_plan: "<PATH>"
routing:
  governance_index: "docs/governance/index.yaml"
  rules_index: "docs/governance/rules/index.yaml"
  template_index: "docs/governance/template/index.yaml"
  responsibility_index: "docs/governance/responsibility/index.yaml"
  essential_template: "docs/governance/template/session/essential.yaml"
  type_template: "<PATH>"
heads:
  start: "<GIT_SHA|null>"
  implementation: "<GIT_SHA|null>"
  exact_validation: "<GIT_SHA|null>"
responsibility_model:
  effects:
    assign: []
    implement: []
    preserve: []
    defer: []
    transfer: []
    retire: []
    forbid: []
  description_ids: []
  rationale_ids: []
work_units:
  - id: "<WORK_UNIT_ID>"
    status: "<COMPLETE|PENDING|BLOCKED>"
    responsibility_refs: []
    input_refs: []
    output_refs: []
    completion_codes: []
evidence:
  - id: "<EVIDENCE_ID>"
    kind: "<EVIDENCE_KIND>"
    head: "<GIT_SHA|null>"
    refs: {}
gates:
  - id: "<GATE_ID>"
    required: true
    status: "<PASS|PENDING|BLOCKED|FAIL>"
    evidence_refs: []
state:
  mode: DERIVED
  ruleset: SESSION_STATE_V1
