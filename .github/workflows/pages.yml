name: Publish signed SCTool Registry Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "registry.json"
      - "packages/**"
      - "publishers/**"
      - "schemas/**"
      - "policy/**"
      - "trust/**"
      - "tools/**"
      - "delivery/**"
      - "docs/**"
      - "governance/**"
      - "AGENTS.md"
      - "ptsip.yaml"
      - ".github/workflows/*.yml"
  push:
    branches:
      - main
      - "dev/**"
    paths:
      - "registry.json"
      - "packages/**"
      - "publishers/**"
      - "schemas/**"
      - "policy/**"
      - "trust/**"
      - "tools/**"
      - "delivery/**"
      - "docs/**"
      - "governance/**"
      - "AGENTS.md"
      - "ptsip.yaml"
      - ".github/workflows/*.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sctool-registry-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      activated: ${{ steps.activation.outputs.activated }}
      handoff_artifact_id: ${{ steps.handoff_bundle.outputs.artifact-id }}
      handoff_artifact_digest: ${{ steps.handoff_bundle.outputs.artifact-digest }}
      handoff_artifact_name: registry-signed-distribution-${{ github.sha }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install PTSIP and delivery validation dependencies
        run: |
          python -m pip install "PTSIP==0.3.7"
          python -m pip install -r tools/requirements.txt

      - name: Validate Registry Client SDK boundary
        run: npm --prefix packages/registry-client-sdk test

      - name: Validate P4 update candidate automation
        shell: bash
        run: |
          update_evidence="$RUNNER_TEMP/update-candidate-validation.json"
          revision="$(git rev-parse HEAD)"
          node packages/registry-client-sdk/tests/generate-update-candidate-evidence.mjs \
            --out "$update_evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$revision"
          python tools/validate-update-candidate-evidence.py \
            --contract docs/UPDATE_CANDIDATE_V1.yaml \
            --evidence "$update_evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$revision"
          cp "$update_evidence" update-candidate-validation.json
          cat "$update_evidence"

      - name: Upload P4 update candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-update-candidate-evidence-${{ github.sha }}
          path: update-candidate-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate PTSIP architecture with exact Product Artifact evidence
        shell: bash
        run: |
          validation="$RUNNER_TEMP/ptsip-validation.json"
          evidence="$RUNNER_TEMP/sctool-registry-product-artifact.json"
          dependency_evidence="$RUNNER_TEMP/sctool-registry-dependency-evidence.json"
          revision="$(git rev-parse HEAD)"
          tracked="$(python -c "from ptsip.repository.snapshot import capture_snapshot; print(capture_snapshot('.').tracked_content_fingerprint)")"

          if ! ptsip validate . --json > "$validation"; then
            cat "$validation"
            exit 1
          fi
          python tools/generate-ptsip-artifact-evidence.py \
            --validation "$validation" \
            --out "$evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$revision" \
            --tracked-content-sha256 "$tracked" \
            --component registry-catalog \
            --component registry-client-sdk \
            --component sctool-authoring-sdk \
            --component repository-tool-authoring-sdk \
            --component registry-contracts \
            --component product-documentation

          python docs/governance/generate-node-platform-evidence.py \
            --validation "$validation" \
            --out "$dependency_evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$revision"

          ptsip conform . \
            --artifact-evidence "$evidence" \
            --external-evidence "$dependency_evidence"

      - name: Validate registry JSON contracts
        run: python tools/validate-registry.py

      - name: Test signed Registry distribution handoff tooling
        run: python tools/test-registry-distribution-handoff.py

      - name: Detect production trust activation
        id: activation
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && -f trust/trust.json ]]; then
            echo "activated=true" >> "$GITHUB_OUTPUT"
          else
            echo "activated=false" >> "$GITHUB_OUTPUT"
            echo "Pages publication is inactive outside main or until trust/trust.json is root-signed and committed."
          fi

      - name: Resolve deterministic publication identity
        if: steps.activation.outputs.activated == 'true'
        id: identity
        shell: bash
        run: |
          echo "sequence=$(git rev-list --count "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "issued_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build signed Pages distribution
        if: steps.activation.outputs.activated == 'true'
        env:
          SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64: ${{ vars.SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64 }}
          SCTOOL_REGISTRY_DISTRIBUTION_PRIVATE_KEY_B64: ${{ secrets.SCTOOL_REGISTRY_DISTRIBUTION_PRIVATE_KEY_B64 }}
        run: >-
          node tools/build-pages.mjs
          --source-revision "$GITHUB_SHA"
          --sequence "${{ steps.identity.outputs.sequence }}"
          --issued-at "${{ steps.identity.outputs.issued_at }}"
          --out _site

      - name: Validate generated Pages JSON contracts
        if: steps.activation.outputs.activated == 'true'
        run: python tools/validate-pages.py --site _site

      - name: Verify generated Pages distribution
        if: steps.activation.outputs.activated == 'true'
        env:
          SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64: ${{ vars.SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64 }}
        run: node tools/verify-pages.mjs --site _site

      - name: Upload exact signed Registry distribution handoff artifact
        if: steps.activation.outputs.activated == 'true'
        id: handoff_bundle
        uses: actions/upload-artifact@v4
        with:
          name: registry-signed-distribution-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Generate exact signed Registry distribution handoff evidence
        if: steps.activation.outputs.activated == 'true'
        shell: bash
        run: |
          node tools/generate-registry-distribution-handoff.mjs \
            --site _site \
            --out registry-distribution-handoff.json \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/pages.yml" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --artifact-name "registry-signed-distribution-$GITHUB_SHA" \
            --artifact-id "${{ steps.handoff_bundle.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.handoff_bundle.outputs.artifact-digest }}"

      - name: Validate exact signed Registry distribution handoff evidence
        if: steps.activation.outputs.activated == 'true'
        run: >-
          python tools/validate-registry-distribution-handoff.py
          --contract docs/REGISTRY_SIGNED_DISTRIBUTION_HANDOFF_V1.yaml
          --schema schemas/registry-distribution-handoff.schema.json
          --evidence registry-distribution-handoff.json
          --site _site

      - name: Upload signed Registry distribution handoff evidence
        if: steps.activation.outputs.activated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registry-signed-distribution-handoff-${{ github.sha }}
          path: registry-distribution-handoff.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report signed Registry distribution handoff coordinates
        if: steps.activation.outputs.activated == 'true'
        shell: bash
        run: |
          {
            echo "### Signed Registry distribution handoff"
            echo ""
            echo "- repository: $GITHUB_REPOSITORY"
            echo "- workflow_run_id: $GITHUB_RUN_ID"
            echo "- workflow_run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- source_revision: $GITHUB_SHA"
            echo "- artifact_name: registry-signed-distribution-$GITHUB_SHA"
            echo "- artifact_id: ${{ steps.handoff_bundle.outputs.artifact-id }}"
            echo "- artifact_digest: ${{ steps.handoff_bundle.outputs.artifact-digest }}"
            echo "- evidence_artifact: registry-signed-distribution-handoff-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        if: steps.activation.outputs.activated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.activation.outputs.activated == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build.outputs.activated == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
