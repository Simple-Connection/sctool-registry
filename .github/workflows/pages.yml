name: Publish signed SCTool Registry Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "registry.json"
      - "packages/**"
      - "publishers/**"
      - "schemas/**"
      - "policy/**"
      - "trust/**"
      - "tools/**"
      - "ptsip.yaml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sctool-registry-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      activated: ${{ steps.activation.outputs.activated }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PTSIP tool
        run: python -m pip install "PTSIP==0.3.6"

      - name: Validate PTSIP architecture
        run: |
          ptsip validate .
          ptsip conform .

      - name: Validate registry JSON contracts
        run: python tools/validate-registry.py

      - name: Detect trust activation
        id: activation
        shell: bash
        run: |
          if [[ -f trust/trust.json ]]; then
            echo "activated=true" >> "$GITHUB_OUTPUT"
          else
            echo "activated=false" >> "$GITHUB_OUTPUT"
            echo "Pages publication is inactive until trust/trust.json is root-signed and committed."
          fi

      - name: Resolve deterministic publication identity
        if: steps.activation.outputs.activated == 'true'
        id: identity
        shell: bash
        run: |
          echo "sequence=$(git rev-list --count "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "issued_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build signed Pages distribution
        if: steps.activation.outputs.activated == 'true'
        env:
          SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64: ${{ vars.SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64 }}
          SCTOOL_REGISTRY_DISTRIBUTION_PRIVATE_KEY_B64: ${{ secrets.SCTOOL_REGISTRY_DISTRIBUTION_PRIVATE_KEY_B64 }}
        run: >-
          node tools/build-pages.mjs
          --source-revision "$GITHUB_SHA"
          --sequence "${{ steps.identity.outputs.sequence }}"
          --issued-at "${{ steps.identity.outputs.issued_at }}"
          --out _site

      - name: Validate generated Pages JSON contracts
        if: steps.activation.outputs.activated == 'true'
        run: python tools/validate-pages.py --site _site

      - name: Verify generated Pages distribution
        if: steps.activation.outputs.activated == 'true'
        env:
          SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64: ${{ vars.SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64 }}
        run: node tools/verify-pages.mjs --site _site

      - name: Configure GitHub Pages
        if: steps.activation.outputs.activated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.activation.outputs.activated == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build.outputs.activated == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
