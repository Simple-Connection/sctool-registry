name: Sign SCTool Registry trust

on:
  workflow_dispatch:
    inputs:
      unsigned_trust_b64:
        description: Base64-encoded unsigned trust JSON containing schemaVersion and signed, without proof
        required: true
        type: string
      expected_sequence:
        description: Expected positive trust sequence for operator confirmation
        required: true
        type: number

permissions:
  contents: write

concurrency:
  group: sctool-registry-root-signing
  cancel-in-progress: false

jobs:
  sign-trust:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install PTSIP and delivery validation dependencies
        run: |
          python -m pip install "PTSIP==0.3.8a1"
          python -c "import importlib.metadata as metadata; print('PTSIP resolved version:', metadata.version('PTSIP'))"
          python -m pip install -r tools/requirements.txt

      - name: Validate repository before trust mutation
        shell: bash
        run: |
          validation="$RUNNER_TEMP/ptsip-validation.json"
          evidence="$RUNNER_TEMP/sctool-registry-product-artifact.json"
          dependency_evidence="$RUNNER_TEMP/sctool-registry-dependency-evidence.json"
          revision="$(git rev-parse HEAD)"
          tracked="$(python -c "from ptsip.repository.snapshot import capture_snapshot; print(capture_snapshot('.').tracked_content_fingerprint)")"

          if ! ptsip validate . --json > "$validation"; then
            cat "$validation"
            exit 1
          fi
          python tools/generate-ptsip-artifact-evidence.py \
            --validation "$validation" \
            --out "$evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$revision" \
            --tracked-content-sha256 "$tracked" \
            --component registry-catalog \
            --component registry-client-sdk \
            --component sctool-authoring-sdk \
            --component repository-tool-authoring-sdk \
            --component registry-contracts \
            --component product-documentation

          python tools/policy_automatic_engine/governance/generate-node-platform-evidence.py \
            --validation "$validation" \
            --out "$dependency_evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$revision"

          ptsip conform . \
            --artifact-evidence "$evidence" \
            --external-evidence "$dependency_evidence"
          python tools/validate-registry.py

      - name: Decode unsigned trust input
        env:
          UNSIGNED_TRUST_B64: ${{ inputs.unsigned_trust_b64 }}
          EXPECTED_SEQUENCE: ${{ inputs.expected_sequence }}
        shell: bash
        run: |
          unsigned="$RUNNER_TEMP/trust-unsigned.json"
          printf '%s' "$UNSIGNED_TRUST_B64" | base64 --decode > "$unsigned"
          actual_sequence="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(value?.signed?.sequence ?? ""));' "$unsigned")"
          if [[ "$actual_sequence" != "$EXPECTED_SEQUENCE" ]]; then
            echo "Unsigned trust sequence mismatch: expected=$EXPECTED_SEQUENCE actual=$actual_sequence" >&2
            exit 1
          fi

      - name: Sign trust descriptor with Registry Root Actions Secret
        env:
          SCTOOL_REGISTRY_ROOT_PRIVATE_KEY_B64: ${{ secrets.SCTOOL_REGISTRY_ROOT_PRIVATE_KEY_B64 }}
          SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64: ${{ vars.SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64 }}
        run: >-
          node tools/sign-trust.mjs
          --input "$RUNNER_TEMP/trust-unsigned.json"
          --out trust/trust.json

      - name: Validate signed trust contract
        env:
          SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64: ${{ vars.SCTOOL_REGISTRY_ROOT_PUBLIC_KEY_B64 }}
        run: |
          python tools/validate-registry.py
          node tools/verify-trust.mjs --trust trust/trust.json

      - name: Commit root-signed trust descriptor
        env:
          EXPECTED_SEQUENCE: ${{ inputs.expected_sequence }}
        shell: bash
        run: |
          git add trust/trust.json
          if git diff --cached --quiet; then
            echo "trust/trust.json is already identical; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "trust: publish root-signed sequence ${EXPECTED_SEQUENCE}"
          git push origin HEAD:main
