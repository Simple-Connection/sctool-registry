name: Validate development governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "ptsip.yaml"
      - "registry.json"
      - "tools/policy_automatic_engine/schemas/**"
      - "packages/registry-client-sdk/**"
      - "packages/sctool-sdk/**"
      - "packages/repository-tool-sdk/**"
      - "packages/README.md"
      - "delivery/**"
      - ".github/workflows/publish-authoring-sdks.yml"
      - ".github/workflows/governance.yml"
      - ".github/workflows/registry-client-sdk-regression.yml"
      - ".github/workflows/registry-sdk-issue-routing.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/registry-sdk-issue-queue.json"
      - "tools/issue-routing/**"
      - "tools/policy_automatic_engine/**"
      - "tools/validate-registry.py"
      - "tools/build-pages.mjs"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - "dev/**"
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "ptsip.yaml"
      - "registry.json"
      - "tools/policy_automatic_engine/schemas/**"
      - "packages/registry-client-sdk/**"
      - "packages/sctool-sdk/**"
      - "packages/repository-tool-sdk/**"
      - "packages/README.md"
      - "delivery/**"
      - ".github/workflows/publish-authoring-sdks.yml"
      - ".github/workflows/governance.yml"
      - ".github/workflows/registry-client-sdk-regression.yml"
      - ".github/workflows/registry-sdk-issue-routing.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/registry-sdk-issue-queue.json"
      - "tools/issue-routing/**"
      - "tools/policy_automatic_engine/**"
      - "tools/validate-registry.py"
      - "tools/build-pages.mjs"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install governance validation dependencies
        run: |
          python -m pip install -r tools/policy_automatic_engine/governance/requirements.txt
          python -m pip install "PTSIP==0.3.8a1"

      - name: Test session-state synchronization tooling
        run: python tools/policy_automatic_engine/governance/tests/test-session-state-sync.py

      - name: Test Registry SDK issue routing tooling
        run: python -m unittest discover -s tools/issue-routing/tests -v

      - name: Validate machine development documentation
        run: python tools/policy_automatic_engine/governance/validate.py --root .

      - name: Validate PTSIP profile and ownership partition
        run: ptsip validate .
