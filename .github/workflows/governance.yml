name: Validate development governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "ptsip.yaml"
      - ".github/workflows/governance.yml"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - "dev/**"
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "ptsip.yaml"
      - ".github/workflows/governance.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install governance validation dependencies
        run: |
          python -m pip install -r docs/governance/requirements.txt
          python -m pip install "PTSIP==0.3.7"

      - name: Validate machine development documentation
        run: python docs/governance/validate.py --root .

      - name: Validate PTSIP profile and ownership partition
        run: ptsip validate .
