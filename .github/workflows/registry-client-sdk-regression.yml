name: Registry Client SDK Regression

on:
  workflow_dispatch:
  push:
    branches:
      - "dev/1.0.3"
    paths:
      - "packages/registry-client-sdk/**"
      - "schemas/registry.schema.json"
      - "schemas/registry-snapshot.schema.json"
      - "registry.json"
      - "tools/build-pages.mjs"
      - "tools/validate-registry.py"
      - "docs/governance/p2-closeout.py"
      - ".github/workflows/registry-client-sdk-regression.yml"
  pull_request:
    paths:
      - "packages/registry-client-sdk/**"
      - "schemas/registry.schema.json"
      - "schemas/registry-snapshot.schema.json"
      - "registry.json"
      - "tools/build-pages.mjs"
      - "tools/validate-registry.py"
      - "docs/governance/p2-closeout.py"
      - ".github/workflows/registry-client-sdk-regression.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: registry-client-sdk-regression-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: cmd

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install closeout validation dependencies
        run: |
          py -3 --version
          py -3 -m pip install -r docs/governance/requirements.txt

      - name: Validate Registry Client SDK syntax
        run: node --check packages/registry-client-sdk/src/discovery.mjs

      - name: Run complete Registry Client SDK regression
        run: npm --prefix packages/registry-client-sdk test

      - name: Verify Registry Client SDK package pack
        working-directory: packages/registry-client-sdk
        run: npm pack --dry-run --json

      - name: Generate exact P2 closeout and handoff
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: py -3 docs/governance/p2-closeout.py --phase p2 --candidate-sha %GITHUB_SHA% --regression-run-id %GITHUB_RUN_ID%

      - name: Validate generated P2 machine closeout
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        run: py -3 docs/governance/validate.py --root .

      - name: Commit local P2 closeout
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.yaml docs/ver1.0.3/1.0.3_Improvement_plan.yaml docs/ver1.0.3/session_document/ver.1.0.3_P2_registry_verified_discovery_profile_consumer.yaml docs/ver1.0.3/session_document/ver.1.0.3_P2_registry_verified_discovery_profile_consumer_work_plan.yaml docs/ver1.0.3/evidence/P2_registry_verified_discovery_profile_consumer_handoff.yaml
          git diff --cached --exit-code && throw "P2 closeout produced no materialized changes"
          git commit -m "docs: auto-close P2 exact discovery handoff"
          "P2_CLOSEOUT_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Validate exact P2 closeout revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        run: py -3 docs/governance/validate.py --root .

      - name: Materialize approved P3 start
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        shell: pwsh
        run: py -3 docs/governance/p2-closeout.py --phase p3 --p2-closeout-sha $env:P2_CLOSEOUT_SHA

      - name: Validate generated P3 machine session
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        run: py -3 docs/governance/validate.py --root .

      - name: Commit local P3 start
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        shell: pwsh
        run: |
          git add docs/index.yaml docs/ver1.0.3/1.0.3_Improvement_plan.yaml docs/ver1.0.3/session_document/ver.1.0.3_P3_product_package_report_routing.yaml docs/ver1.0.3/session_document/ver.1.0.3_P3_product_package_report_routing_work_plan.yaml
          git diff --cached --exit-code && throw "P3 start produced no materialized changes"
          git commit -m "docs: start P3 product report routing"
          "P3_START_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Validate exact P3 start revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        run: py -3 docs/governance/validate.py --root .

      - name: Push atomic P2 closeout and P3 start
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/1.0.3'
        shell: pwsh
        run: |
          git push origin HEAD:refs/heads/dev/1.0.3
          Write-Host "P2 closeout: $env:P2_CLOSEOUT_SHA"
          Write-Host "P3 start: $env:P3_START_COMMIT"
