name: Tooling test

on:
  workflow_dispatch:
  push:
    branches:
      - "dev/**"
    paths:
      - "docs/**"
      - "ptsip.yaml"
      - ".github/workflows/tooling-test.yml"
  pull_request:
    paths:
      - "docs/**"
      - "ptsip.yaml"
      - ".github/workflows/tooling-test.yml"

defaults:
  run:
    shell: cmd

permissions:
  contents: read

jobs:
  governance:
    runs-on: self-hosted
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bootstrap isolated Python
        run: |
          set "PY_VERSION=3.12.10"
          set "PY_HOME=%LOCALAPPDATA%\SimpleConnection\gha-python-%PY_VERSION%"
          set "PY_EXE=%PY_HOME%\python.exe"
          set "PY_INSTALLER=%RUNNER_TEMP%\python-%PY_VERSION%-amd64.exe"
          if not exist "%PY_EXE%" (
            curl.exe --fail --location --retry 3 --output "%PY_INSTALLER%" "https://www.python.org/ftp/python/%PY_VERSION%/python-%PY_VERSION%-amd64.exe"
            if errorlevel 1 exit /b 1
            start "" /wait "%PY_INSTALLER%" /quiet InstallAllUsers=0 TargetDir="%PY_HOME%" Include_pip=1 Include_launcher=0 PrependPath=0 Shortcuts=0 Include_test=0 Include_doc=0
            if errorlevel 1 exit /b 1
          )
          "%PY_EXE%" --version
          if errorlevel 1 exit /b 1
          echo SCTOOL_PYTHON=%PY_EXE%>>"%GITHUB_ENV%"

      - name: Install governance dependencies
        run: |
          "%SCTOOL_PYTHON%" -m pip install --disable-pip-version-check -r docs/governance/requirements.txt
          "%SCTOOL_PYTHON%" -m pip install --disable-pip-version-check "PTSIP==0.3.7"

      - name: Test session state synchronization
        run: |
          "%SCTOOL_PYTHON%" docs/governance/test-session-state-sync.py

      - name: Test source task binding
        run: |
          "%SCTOOL_PYTHON%" docs/governance/test-task-contract.py

      - name: Validate machine development documentation
        run: |
          "%SCTOOL_PYTHON%" docs/governance/validate.py --root .

      - name: Validate PTSIP profile
        run: |
          "%SCTOOL_PYTHON%" -m ptsip validate .
