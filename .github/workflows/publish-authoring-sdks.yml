name: Publish Authoring SDK Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Authoring SDK package to publish or immutably verify
        required: true
        default: sctool-sdk
        type: choice
        options:
          - sctool-sdk
          - repository-tool-sdk
          - all
  push:
    branches:
      - "main"
    paths:
      - "packages/sctool-sdk/**"
      - "packages/repository-tool-sdk/**"
      - "docs/AUTHORING_SDK_DISTRIBUTION_V1.yaml"
      - ".github/workflows/publish-authoring-sdks.yml"
      - "delivery/authoring-sdk-package/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: authoring-sdk-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-npmjs-sdks]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Configure Node and npmjs public registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@simple-connection"
          package-manager-cache: false

      - name: Verify trusted-publishing-capable npm client
        shell: bash
        run: |
          node -e "const {execFileSync}=require('node:child_process');const v=execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&v[1]<5))throw new Error('npm >= 11.5.1 required for trusted publishing');console.log('npm trusted publishing client PASS',v.join('.'))"

      - name: Resolve publication target
        id: target
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${{ inputs.package }}"
          else
            target="all"
          fi
          echo "package=$target" >> "$GITHUB_OUTPUT"
          echo "Authoring SDK publication target: $target"

      - name: Validate SCTool Authoring SDK
        if: steps.target.outputs.package == 'sctool-sdk' || steps.target.outputs.package == 'all'
        run: |
          npm --prefix packages/sctool-sdk ci --ignore-scripts
          npm --prefix packages/sctool-sdk run typecheck
          npm --prefix packages/sctool-sdk run build
          npm --prefix packages/sctool-sdk run test
          node --check packages/sctool-sdk/cli/sctool.mjs

      - name: Validate Repository Tool Authoring SDK
        if: steps.target.outputs.package == 'repository-tool-sdk' || steps.target.outputs.package == 'all'
        run: |
          npm --prefix packages/repository-tool-sdk ci --ignore-scripts
          npm --prefix packages/repository-tool-sdk run typecheck
          npm --prefix packages/repository-tool-sdk run test:contract

      - name: Publish or verify immutable Authoring SDK package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          package_content_digest() {
            archive="$1"
            extract_root="$2"
            manifest_path="$3"

            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            tar -xzf "$archive" -C "$extract_root"

            package_root="$extract_root/package"
            if [[ ! -d "$package_root" ]]; then
              echo "Packed artifact is missing the package/ root: $archive" >&2
              return 1
            fi

            node - "$package_root" "$manifest_path" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.argv[2];
          const manifestPath = process.argv[3];
          const entries = [];

          function modeOf(stat) {
            return (stat.mode & 0o777).toString(8).padStart(3, "0");
          }

          function visit(relativePath) {
            const absolutePath = path.join(root, relativePath);
            const stat = fs.lstatSync(absolutePath);
            const canonicalPath = relativePath.split(path.sep).join("/");

            if (stat.isDirectory()) {
              for (const child of fs.readdirSync(absolutePath).sort()) {
                visit(path.join(relativePath, child));
              }
              return;
            }

            if (stat.isSymbolicLink()) {
              entries.push({
                path: canonicalPath,
                type: "symlink",
                mode: modeOf(stat),
                target: fs.readlinkSync(absolutePath),
              });
              return;
            }

            if (!stat.isFile()) {
              throw new Error(`Unsupported package entry type: ${canonicalPath}`);
            }

            const bytes = fs.readFileSync(absolutePath);
            entries.push({
              path: canonicalPath,
              type: "file",
              mode: modeOf(stat),
              size: bytes.length,
              sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
            });
          }

          for (const child of fs.readdirSync(root).sort()) {
            visit(child);
          }

          const canonical = JSON.stringify(entries);
          const digest = crypto.createHash("sha256").update(canonical).digest("hex");
          const manifest = {
            format: "npm-package-content-manifest/v1",
            algorithm: "sha256",
            digest,
            entries,
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          process.stdout.write(digest);
          NODE
          }

          publish_one() {
            package_dir="$1"
            evidence_name="$2"
            pushd "$package_dir" >/dev/null

            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            pack_json="$RUNNER_TEMP/${evidence_name}-pack.json"
            evidence="$RUNNER_TEMP/${evidence_name}-evidence.json"
            local_manifest="$RUNNER_TEMP/${evidence_name}-local-content-manifest.json"
            remote_manifest="$RUNNER_TEMP/${evidence_name}-remote-content-manifest.json"
            local_extract="$RUNNER_TEMP/${evidence_name}-local-extract"
            remote_extract="$RUNNER_TEMP/${evidence_name}-remote-extract"
            remote_dir="$RUNNER_TEMP/${evidence_name}-remote"

            npm pack --json > "$pack_json"
            tarball="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].filename)" "$pack_json")"
            local_integrity="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].integrity)" "$pack_json")"
            local_shasum="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].shasum)" "$pack_json")"
            local_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
            local_content_digest="$(package_content_digest "$tarball" "$local_extract" "$local_manifest")"
            # Package content identity is authoritative; tarball integrity remains diagnostic evidence only.
            echo "Immutable npm resolution authority: anonymous exact package content"

            fetch_remote_package() {
              rm -rf "$remote_dir" "$remote_extract"
              mkdir -p "$remote_dir"
              remote_pack_json="$RUNNER_TEMP/${evidence_name}-remote-pack.json"

              pushd "$remote_dir" >/dev/null
              set +e
              env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/dev/null \
                npm pack "$name@$version" --json --registry=https://registry.npmjs.org > "$remote_pack_json" 2>/dev/null
              remote_pack_status=$?
              set -e
              if [[ $remote_pack_status -ne 0 ]]; then
                popd >/dev/null
                return 1
              fi

              remote_tarball_name="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].filename)" "$remote_pack_json")"
              remote_integrity="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].integrity||'')" "$remote_pack_json")"
              remote_shasum="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].shasum||'')" "$remote_pack_json")"
              remote_tarball_path="$remote_dir/$remote_tarball_name"
              remote_sha256="$(sha256sum "$remote_tarball_path" | awk '{print $1}')"
              remote_content_digest="$(package_content_digest "$remote_tarball_path" "$remote_extract" "$remote_manifest")"
              popd >/dev/null
              return 0
            }

            fetch_remote_package_with_retry() {
              max_attempts="$1"
              delay_seconds="$2"
              for attempt in $(seq 1 "$max_attempts"); do
                if fetch_remote_package; then
                  return 0
                fi
                if [[ "$attempt" -lt "$max_attempts" ]]; then
                  echo "Anonymous npm package retrieval not ready yet: $name@$version (attempt $attempt/$max_attempts)"
                  sleep "$delay_seconds"
                fi
              done
              return 1
            }

            # Resolve immutable versions by anonymously fetching package content first.
            # npm metadata freshness is not authoritative for existence.
            if fetch_remote_package_with_retry 3 2; then
              if [[ "$remote_content_digest" != "$local_content_digest" ]]; then
                echo "Existing package content does not match canonical source: $name@$version" >&2
                echo "local_content_sha256=$local_content_digest" >&2
                echo "remote_content_sha256=$remote_content_digest" >&2
                exit 1
              fi
              publish_status="EXISTING_VERIFIED"
              resolution_status="ANONYMOUS_CONTENT_FETCH"
            else
              if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
                echo "NPMJS_BOOTSTRAP_AUTH_REQUIRED: publication may require repository secret NPM_TOKEN until npm trusted publishing is configured for $name." >&2
              fi

              publish_log="$RUNNER_TEMP/${evidence_name}-publish.log"
              set +e
              npm publish "$tarball" --registry=https://registry.npmjs.org --access public 2>&1 | tee "$publish_log"
              publish_exit=${PIPESTATUS[0]}
              set -e

              if [[ $publish_exit -eq 0 ]]; then
                publish_status="PUBLISHED"
                resolution_status="PUBLISHED_THEN_VERIFIED"
              elif grep -Eiq 'cannot publish over (the )?previously published versions|previously published version|EPUBLISHCONFLICT' "$publish_log"; then
                echo "Immutable version publish conflict detected; recovering by exact anonymous content verification: $name@$version"
                publish_status="EXISTING_VERIFIED"
                resolution_status="PUBLISH_CONFLICT_RECOVERED"
              else
                echo "npm publish failed for a reason other than immutable-version conflict: $name@$version" >&2
                exit "$publish_exit"
              fi

              if ! fetch_remote_package_with_retry 20 3; then
                echo "Unable to retrieve npm package anonymously after publish/conflict resolution retries: $name@$version" >&2
                exit 1
              fi

              if [[ "$remote_content_digest" != "$local_content_digest" ]]; then
                echo "Remote package content mismatch after publish/conflict resolution: $name@$version" >&2
                echo "local_content_sha256=$local_content_digest" >&2
                echo "remote_content_sha256=$remote_content_digest" >&2
                exit 1
              fi
            fi

            remote_json="$(env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/dev/null npm view "$name@$version" --json --registry=https://registry.npmjs.org)"
            remote_registry_integrity="$(node -e "const d=JSON.parse(process.argv[1]);process.stdout.write(d.dist?.integrity||'')" "$remote_json")"
            remote_tarball_url="$(node -e "const d=JSON.parse(process.argv[1]);process.stdout.write(d.dist?.tarball||'')" "$remote_json")"

            SOURCE_REPOSITORY="$GITHUB_REPOSITORY" \
            SOURCE_REVISION="$GITHUB_SHA" \
            PACKAGE_NAME="$name" \
            PACKAGE_VERSION="$version" \
            LOCAL_INTEGRITY="$local_integrity" \
            REMOTE_PACK_INTEGRITY="$remote_integrity" \
            REMOTE_REGISTRY_INTEGRITY="$remote_registry_integrity" \
            REMOTE_TARBALL_URL="$remote_tarball_url" \
            LOCAL_SHASUM="$local_shasum" \
            REMOTE_SHASUM="$remote_shasum" \
            LOCAL_SHA256="$local_sha256" \
            REMOTE_SHA256="$remote_sha256" \
            LOCAL_CONTENT_DIGEST="$local_content_digest" \
            REMOTE_CONTENT_DIGEST="$remote_content_digest" \
            PUBLISH_STATUS="$publish_status" \
            RESOLUTION_STATUS="$resolution_status" \
            EVIDENCE_PATH="$evidence" \
            node -e 'const fs=require("fs");const e={format:"authoring-sdk-package-evidence/v2",package:{name:process.env.PACKAGE_NAME,version:process.env.PACKAGE_VERSION,registry:"https://registry.npmjs.org",tarball:process.env.REMOTE_TARBALL_URL},source:{repository:process.env.SOURCE_REPOSITORY,revision:process.env.SOURCE_REVISION},verification:{method:"EXACT_PACKAGE_CONTENT_SHA256_V1",failClosed:true,anonymousRemoteRetrieval:true,contentExact:process.env.LOCAL_CONTENT_DIGEST===process.env.REMOTE_CONTENT_DIGEST},content:{localSha256:process.env.LOCAL_CONTENT_DIGEST,remoteSha256:process.env.REMOTE_CONTENT_DIGEST},tarball:{localNpmIntegrity:process.env.LOCAL_INTEGRITY,remotePackNpmIntegrity:process.env.REMOTE_PACK_INTEGRITY,remoteRegistryNpmIntegrity:process.env.REMOTE_REGISTRY_INTEGRITY,localSha1:process.env.LOCAL_SHASUM,remoteSha1:process.env.REMOTE_SHASUM,localSha256:process.env.LOCAL_SHA256,remoteSha256:process.env.REMOTE_SHA256},publication:{status:process.env.PUBLISH_STATUS,resolution:process.env.RESOLUTION_STATUS,immutableVersionVerified:true}};fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(e,null,2)+"\n")'
            cat "$evidence"
            popd >/dev/null
          }

          case "${{ steps.target.outputs.package }}" in
            sctool-sdk)
              publish_one "packages/sctool-sdk" "sctool-sdk-package"
              ;;
            repository-tool-sdk)
              publish_one "packages/repository-tool-sdk" "repository-tool-sdk-package"
              ;;
            all)
              publish_one "packages/sctool-sdk" "sctool-sdk-package"
              publish_one "packages/repository-tool-sdk" "repository-tool-sdk-package"
              ;;
            *)
              echo "Unsupported publication target: ${{ steps.target.outputs.package }}" >&2
              exit 1
              ;;
          esac

      - name: Verify anonymous public SCTool Authoring SDK exports
        if: steps.target.outputs.package == 'sctool-sdk' || steps.target.outputs.package == 'all'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/sctool-sdk-published-verify"
          mkdir -p "$verify_dir"
          pushd "$verify_dir" >/dev/null
          npm pack "@simple-connection/sctool-sdk@0.2.1" --json --registry=https://registry.npmjs.org > remote-pack.json
          tarball="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('remote-pack.json','utf8'));process.stdout.write(d[0].filename)")"
          mkdir extracted
          tar -xzf "$tarball" -C extracted
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const pkg = JSON.parse(fs.readFileSync("extracted/package/package.json", "utf8"));
          if (pkg.version !== "0.2.1") throw new Error(`Unexpected published version: ${pkg.version}`);
          const required = [
            "./marketplace-profile",
            "./marketplace-profile-schema",
            "./marketplace-profile-template",
          ];
          for (const key of required) {
            if (!Object.prototype.hasOwnProperty.call(pkg.exports || {}, key)) {
              throw new Error(`Missing published export: ${key}`);
            }
          }
          const fileTargets = [
            "dist/marketplace-profile.js",
            "dist/marketplace-profile.d.ts",
            "schemas/marketplace-profile.schema.json",
            "templates/marketplace-profile.json",
          ];
          for (const rel of fileTargets) {
            if (!fs.existsSync(path.join("extracted/package", rel))) {
              throw new Error(`Missing published file: ${rel}`);
            }
          }
          console.log("Published SCTool Authoring SDK exports verification PASS");
          NODE
          popd >/dev/null

      - name: Verify anonymous public Repository Tool SDK package
        if: steps.target.outputs.package == 'repository-tool-sdk' || steps.target.outputs.package == 'all'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/repository-tool-sdk-published-verify"
          mkdir -p "$verify_dir"
          pushd "$verify_dir" >/dev/null
          npm pack "@simple-connection/repository-tool-sdk@0.1.1" --json --registry=https://registry.npmjs.org > remote-pack.json
          tarball="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('remote-pack.json','utf8'));process.stdout.write(d[0].filename)")"
          mkdir extracted
          tar -xzf "$tarball" -C extracted
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const pkg = JSON.parse(fs.readFileSync("extracted/package/package.json", "utf8"));
          if (pkg.version !== "0.1.1") throw new Error(`Unexpected published version: ${pkg.version}`);
          const rootExport = pkg.exports?.["."];
          if (!rootExport?.import || !rootExport?.types) throw new Error("Missing Repository Tool SDK root export");
          for (const rel of ["dist/index.js", "dist/index.d.ts", "schemas/repository-tool.schema.json"]) {
            if (!fs.existsSync(path.join("extracted/package", rel))) throw new Error(`Missing published file: ${rel}`);
          }
          console.log("Anonymous Repository Tool SDK verification PASS");
          NODE
          popd >/dev/null

      - name: Upload Authoring SDK package evidence
        uses: actions/upload-artifact@v6
        with:
          name: authoring-sdk-package-evidence-${{ github.sha }}-${{ steps.target.outputs.package }}
          path: |
            ${{ runner.temp }}/*-package-evidence.json
            ${{ runner.temp }}/*-content-manifest.json
          if-no-files-found: error
          retention-days: 30
