name: Publish Authoring SDK Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Authoring SDK package to publish or immutably verify
        required: true
        default: sctool-sdk
        type: choice
        options:
          - sctool-sdk
          - repository-tool-sdk
          - all
  push:
    branches:
      - "main"
    paths:
      - "packages/sctool-sdk/**"
      - "packages/repository-tool-sdk/**"
      - "docs/AUTHORING_SDK_DISTRIBUTION_V1.yaml"
      - ".github/workflows/publish-authoring-sdks.yml"
      - "delivery/authoring-sdk-package/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: authoring-sdk-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-npmjs-sdks]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Configure Node and npmjs public registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@simple-connection"
          package-manager-cache: false

      - name: Verify trusted-publishing-capable npm client
        shell: bash
        run: |
          node -e "const {execFileSync}=require('node:child_process');const v=execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&v[1]<5))throw new Error('npm >= 11.5.1 required for trusted publishing');console.log('npm trusted publishing client PASS',v.join('.'))"

      - name: Resolve publication target
        id: target
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${{ inputs.package }}"
          else
            target="all"
          fi
          echo "package=$target" >> "$GITHUB_OUTPUT"
          echo "Authoring SDK publication target: $target"

      - name: Validate SCTool Authoring SDK
        if: steps.target.outputs.package == 'sctool-sdk' || steps.target.outputs.package == 'all'
        run: |
          npm --prefix packages/sctool-sdk ci --ignore-scripts
          npm --prefix packages/sctool-sdk run typecheck
          npm --prefix packages/sctool-sdk run build
          npm --prefix packages/sctool-sdk run test
          node --check packages/sctool-sdk/cli/sctool.mjs

      - name: Validate Repository Tool Authoring SDK
        if: steps.target.outputs.package == 'repository-tool-sdk' || steps.target.outputs.package == 'all'
        run: |
          npm --prefix packages/repository-tool-sdk ci --ignore-scripts
          npm --prefix packages/repository-tool-sdk run typecheck
          npm --prefix packages/repository-tool-sdk run test:contract

      - name: Publish or verify immutable Authoring SDK package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          publish_one() {
            package_dir="$1"
            evidence_name="$2"
            pushd "$package_dir" >/dev/null

            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            pack_json="$RUNNER_TEMP/${evidence_name}-pack.json"
            evidence="$RUNNER_TEMP/${evidence_name}-evidence.json"

            npm pack --json > "$pack_json"
            tarball="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].filename)" "$pack_json")"
            local_integrity="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].integrity)" "$pack_json")"
            local_shasum="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(d[0].shasum)" "$pack_json")"
            local_sha256="$(sha256sum "$tarball" | awk '{print $1}')"

            set +e
            remote_json="$(npm view "$name@$version" --json --registry=https://registry.npmjs.org 2>/dev/null)"
            view_status=$?
            set -e

            if [[ $view_status -eq 0 && -n "$remote_json" ]]; then
              remote_integrity="$(node -e "const d=JSON.parse(process.argv[1]);process.stdout.write(d.dist?.integrity||'')" "$remote_json")"
              if [[ "$remote_integrity" != "$local_integrity" ]]; then
                echo "Existing package integrity does not match canonical source: $name@$version" >&2
                exit 1
              fi
              publish_status="EXISTING_VERIFIED"
            else
              set +e
              npm view "$name" name --registry=https://registry.npmjs.org >/dev/null 2>&1
              package_exists_status=$?
              set -e
              if [[ $package_exists_status -ne 0 && -z "${NODE_AUTH_TOKEN:-}" ]]; then
                echo "NPMJS_BOOTSTRAP_AUTH_REQUIRED: first publication requires repository secret NPM_TOKEN with npm scope publish authority for $name." >&2
                echo "After first publication, configure npm trusted publishing for publish-authoring-sdks.yml and remove the long-lived publish token." >&2
                exit 1
              fi
              npm publish "$tarball" --registry=https://registry.npmjs.org --access public
              publish_status="PUBLISHED"
            fi

            remote_json=""
            for attempt in 1 2 3 4 5; do
              set +e
              remote_json="$(npm view "$name@$version" --json --registry=https://registry.npmjs.org 2>/dev/null)"
              status=$?
              set -e
              if [[ $status -eq 0 && -n "$remote_json" ]]; then break; fi
              sleep 2
            done
            if [[ -z "$remote_json" ]]; then
              echo "Unable to resolve published package: $name@$version" >&2
              exit 1
            fi

            remote_integrity="$(node -e "const d=JSON.parse(process.argv[1]);process.stdout.write(d.dist?.integrity||'')" "$remote_json")"
            remote_tarball="$(node -e "const d=JSON.parse(process.argv[1]);process.stdout.write(d.dist?.tarball||'')" "$remote_json")"
            if [[ "$remote_integrity" != "$local_integrity" ]]; then
              echo "Remote integrity mismatch after publication: $name@$version" >&2
              exit 1
            fi

            SOURCE_REPOSITORY="$GITHUB_REPOSITORY" SOURCE_REVISION="$GITHUB_SHA" PACKAGE_NAME="$name" PACKAGE_VERSION="$version" LOCAL_INTEGRITY="$local_integrity" REMOTE_INTEGRITY="$remote_integrity" REMOTE_TARBALL="$remote_tarball" LOCAL_SHASUM="$local_shasum" LOCAL_SHA256="$local_sha256" PUBLISH_STATUS="$publish_status" EVIDENCE_PATH="$evidence" node -e 'const fs=require("fs");const e={format:"authoring-sdk-package-evidence/v1",package:{name:process.env.PACKAGE_NAME,version:process.env.PACKAGE_VERSION,registry:"https://registry.npmjs.org",tarball:process.env.REMOTE_TARBALL},source:{repository:process.env.SOURCE_REPOSITORY,revision:process.env.SOURCE_REVISION},integrity:{npm:process.env.LOCAL_INTEGRITY,remoteNpm:process.env.REMOTE_INTEGRITY,sha1:process.env.LOCAL_SHASUM,sha256:process.env.LOCAL_SHA256},publication:{status:process.env.PUBLISH_STATUS,immutableVersionVerified:true}};fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(e,null,2)+"\\n")'
            cat "$evidence"
            popd >/dev/null
          }

          case "${{ steps.target.outputs.package }}" in
            sctool-sdk)
              publish_one "packages/sctool-sdk" "sctool-sdk-package"
              ;;
            repository-tool-sdk)
              publish_one "packages/repository-tool-sdk" "repository-tool-sdk-package"
              ;;
            all)
              publish_one "packages/sctool-sdk" "sctool-sdk-package"
              publish_one "packages/repository-tool-sdk" "repository-tool-sdk-package"
              ;;
            *)
              echo "Unsupported publication target: ${{ steps.target.outputs.package }}" >&2
              exit 1
              ;;
          esac

      - name: Verify anonymous public SCTool Authoring SDK exports
        if: steps.target.outputs.package == 'sctool-sdk' || steps.target.outputs.package == 'all'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/sctool-sdk-published-verify"
          mkdir -p "$verify_dir"
          pushd "$verify_dir" >/dev/null
          npm pack "@simple-connection/sctool-sdk@0.2.1" --json --registry=https://registry.npmjs.org > remote-pack.json
          tarball="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('remote-pack.json','utf8'));process.stdout.write(d[0].filename)")"
          mkdir extracted
          tar -xzf "$tarball" -C extracted
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const pkg = JSON.parse(fs.readFileSync("extracted/package/package.json", "utf8"));
          if (pkg.version !== "0.2.1") throw new Error(`Unexpected published version: ${pkg.version}`);
          const required = [
            "./marketplace-profile",
            "./marketplace-profile-schema",
            "./marketplace-profile-template",
          ];
          for (const key of required) {
            if (!Object.prototype.hasOwnProperty.call(pkg.exports || {}, key)) {
              throw new Error(`Missing published export: ${key}`);
            }
          }
          const fileTargets = [
            "dist/marketplace-profile.js",
            "dist/marketplace-profile.d.ts",
            "schemas/marketplace-profile.schema.json",
            "templates/marketplace-profile.json",
          ];
          for (const rel of fileTargets) {
            if (!fs.existsSync(path.join("extracted/package", rel))) {
              throw new Error(`Missing published file: ${rel}`);
            }
          }
          console.log("Published SCTool Authoring SDK exports verification PASS");
          NODE
          popd >/dev/null

      - name: Verify anonymous public Repository Tool SDK package
        if: steps.target.outputs.package == 'repository-tool-sdk' || steps.target.outputs.package == 'all'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/repository-tool-sdk-published-verify"
          mkdir -p "$verify_dir"
          pushd "$verify_dir" >/dev/null
          npm pack "@simple-connection/repository-tool-sdk@0.1.1" --json --registry=https://registry.npmjs.org > remote-pack.json
          tarball="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('remote-pack.json','utf8'));process.stdout.write(d[0].filename)")"
          mkdir extracted
          tar -xzf "$tarball" -C extracted
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const pkg = JSON.parse(fs.readFileSync("extracted/package/package.json", "utf8"));
          if (pkg.version !== "0.1.1") throw new Error(`Unexpected published version: ${pkg.version}`);
          const rootExport = pkg.exports?.["."];
          if (!rootExport?.import || !rootExport?.types) throw new Error("Missing Repository Tool SDK root export");
          for (const rel of ["dist/index.js", "dist/index.d.ts", "schemas/repository-tool.schema.json"]) {
            if (!fs.existsSync(path.join("extracted/package", rel))) throw new Error(`Missing published file: ${rel}`);
          }
          console.log("Anonymous Repository Tool SDK verification PASS");
          NODE
          popd >/dev/null

      - name: Upload Authoring SDK package evidence
        uses: actions/upload-artifact@v6
        with:
          name: authoring-sdk-package-evidence-${{ github.sha }}-${{ steps.target.outputs.package }}
          path: ${{ runner.temp }}/*-package-evidence.json
          if-no-files-found: error
          retention-days: 30
