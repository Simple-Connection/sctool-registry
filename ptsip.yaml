ptsip:
  version: "pp.1.01"
  specification:
    family: "0.3.7-draft"
    source: "https://github.com/Kinirin/PTSIP"
    revision: "3c47816770d194ae42f98faedc911d980db0e62a"

responsibility_map:
  mode: explicit

components:
  - id: registry-catalog
    classification: PRODUCT
    roles:
      - CONFIGURATION
    include:
      - "registry.json"
    purpose: public_sctool_package_discovery_and_runtime_registry_index
    shipped: true
    runtime_required: true
    executable: false
    release_owner: registry
    compatibility_owner: registry

  - id: registry-client-sdk
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "packages/registry-client-sdk/**"
    purpose: simple_connection_runtime_registry_metadata_access_delivery_and_integrity_client_sdk
    shipped: true
    runtime_required: true
    executable: true
    release_owner: registry-client-sdk
    compatibility_owner: registry-contract
    manifests:
      - "packages/registry-client-sdk/package.json"
    analysis_inputs:
      - "tools/policy_automatic_engine/schemas/package/package.schema.json"
      - "docs/policy/registry/registry-policy.json"
      - "docs/REGISTRY_CONTRACT_V2.md"
      - "docs/REGISTRY_ACCESS_V1.md"
      - "docs/ARTIFACT_DELIVERY_V1.md"
      - "docs/STAGED_ARTIFACT_LIFECYCLE_V1.yaml"
      - "docs/UPDATE_CANDIDATE_V1.yaml"
      - "docs/INITIAL_INSTALL_CANDIDATE_V1.yaml"
      - "docs/SIMPLE_CONNECTION_INSTALL_TRANSACTION_V1.yaml"

  - id: sctool-authoring-sdk
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "packages/sctool-sdk/**"
    purpose: sctool_authoring_validation_build_test_and_packaging_sdk
    shipped: true
    runtime_required: false
    executable: true
    release_owner: sctool-authoring-sdk
    compatibility_owner: sctool-authoring-sdk
    manifests:
      - "packages/sctool-sdk/package.json"

  - id: repository-tool-authoring-sdk
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "packages/repository-tool-sdk/**"
    purpose: repository_tool_descriptor_validation_scaffold_and_authoring_sdk
    shipped: true
    runtime_required: false
    executable: true
    release_owner: repository-tool-authoring-sdk
    compatibility_owner: repository-tool-authoring-sdk
    manifests:
      - "packages/repository-tool-sdk/package.json"

  - id: registry-contracts
    classification: NEUTRAL_CONTRACT
    roles:
      - CONFIGURATION
      - GOVERNANCE
      - DOCUMENTATION
    include:
      - "tools/policy_automatic_engine/schemas/**"
      - "docs/policy/registry/registry-policy.json"
      - "docs/REGISTRY_CONTRACT_V2.md"
      - "docs/REGISTRY_ACCESS_V1.md"
      - "docs/ARTIFACT_DELIVERY_V1.md"
      - "docs/STAGED_ARTIFACT_LIFECYCLE_V1.yaml"
      - "docs/UPDATE_CANDIDATE_V1.yaml"
      - "docs/INITIAL_INSTALL_CANDIDATE_V1.yaml"
      - "docs/SIMPLE_CONNECTION_INSTALL_TRANSACTION_V1.yaml"
      - "docs/SIMPLE_CONNECTION_ACTIVATION_ROLLBACK_V1.yaml"
      - "docs/REGISTRY_CLIENT_SDK_DISTRIBUTION_V1.yaml"
      - "docs/AUTHORING_SDK_DISTRIBUTION_V1.yaml"
      - "docs/PAGES_DISTRIBUTION_V1.md"
      - "docs/REGISTRY_SIGNED_DISTRIBUTION_HANDOFF_V1.yaml"
      - "docs/policy/**"
      - "trust/**"
    purpose: canonical_registry_submission_distribution_trust_integrity_and_admission_contracts
    shipped: true
    runtime_required: false
    executable: false
    release_owner: registry-contract
    compatibility_owner: registry-contract

  - id: registry-sdk-package-delivery
    classification: DELIVERY
    roles:
      - AUTOMATION
      - VERIFICATION
      - CONFIGURATION
    include:
      - ".github/workflows/publish-registry-client-sdk.yml"
      - "delivery/registry-client-sdk-package/**"
    purpose: versioned_registry_client_sdk_public_npmjs_publication_and_integrity_binding
    shipped: false
    runtime_required: false
    executable: true
    release_owner: registry-sdk-package-delivery
    compatibility_owner: registry-contract
    manifests:
      - "delivery/registry-client-sdk-package/package.json"
    analysis_inputs:
      - "packages/registry-client-sdk/package.json"
      - "packages/registry-client-sdk/src/**"
      - "docs/REGISTRY_CLIENT_SDK_DISTRIBUTION_V1.yaml"

  - id: authoring-sdk-package-delivery
    classification: DELIVERY
    roles:
      - AUTOMATION
      - VERIFICATION
      - CONFIGURATION
    include:
      - ".github/workflows/publish-authoring-sdks.yml"
      - "delivery/authoring-sdk-package/**"
    purpose: immutable_public_npmjs_publication_for_registry_owned_authoring_sdks
    shipped: false
    runtime_required: false
    executable: true
    release_owner: authoring-sdk-package-delivery
    compatibility_owner: registry-contract
    manifests:
      - "delivery/authoring-sdk-package/package.json"
    analysis_inputs:
      - "packages/sctool-sdk/**"
      - "packages/repository-tool-sdk/**"
      - "docs/AUTHORING_SDK_DISTRIBUTION_V1.yaml"

  - id: registry-pages-delivery
    classification: DELIVERY
    roles:
      - AUTOMATION
      - VERIFICATION
      - CONFIGURATION
    include:
      - ".github/workflows/pages.yml"
      - ".github/workflows/sign-trust.yml"
      - "tools/build-pages.mjs"
      - "tools/generate-ed25519-keypair.mjs"
      - "tools/generate-ptsip-artifact-evidence.py"
      - "tools/generate-registry-distribution-handoff.mjs"
      - "tools/lib/**"
      - "tools/package.json"
      - "tools/requirements.txt"
      - "tools/sign-trust.mjs"
      - "tools/test-delivery-package-schema-v2.py"
      - "tools/test-registry-distribution-handoff.py"
      - "tools/validate-pages.py"
      - "tools/validate-registry-distribution-handoff.py"
      - "tools/validate-registry.py"
      - "tools/validate-update-candidate-evidence.py"
      - "tools/verify-pages.mjs"
      - "tools/verify-trust.mjs"
    purpose: signed_registry_snapshot_assembly_root_trust_signing_verification_key_bootstrap_and_exact_handoff_production
    shipped: false
    runtime_required: false
    executable: true
    release_owner: delivery
    compatibility_owner: registry-contract
    manifests:
      - "tools/package.json"
      - "tools/requirements.txt"
    analysis_inputs:
      - "registry.json"
      - "packages/**"
      - "publishers/**"
      - "tools/policy_automatic_engine/schemas/**"
      - "docs/policy/**"
      - "trust/**"
      - "docs/REGISTRY_SIGNED_DISTRIBUTION_HANDOFF_V1.yaml"
      - "tools/policy_automatic_engine/schemas/registry/registry-distribution-handoff.schema.json"
      - "ptsip.yaml"

  - id: product-documentation
    classification: PRODUCT
    roles:
      - DOCUMENTATION
    include:
      - "README.md"
      - "packages/README.md"
      - "publishers/README.md"
    purpose: public_registry_usage_package_and_publisher_documentation
    shipped: true
    runtime_required: false
    executable: false
    release_owner: registry
    compatibility_owner: registry

  - id: policy-automatic-engine
    classification: DEVELOPMENT_TOOLING
    roles:
      - CONFIGURATION
      - GOVERNANCE
      - IMPLEMENTATION
      - VERIFICATION
      - AUTOMATION
    include:
      - "tools/policy_automatic_engine/governance/**"
    purpose: policy_machine_routing_repository_validation_and_governance_execution_engine
    shipped: false
    runtime_required: false
    executable: true
    release_owner: development-tooling
    compatibility_owner: development-tooling
    manifests:
      - "tools/policy_automatic_engine/governance/requirements.txt"

  - id: repository-governance
    classification: DEVELOPMENT_TOOLING
    roles:
      - CONFIGURATION
      - GOVERNANCE
      - DOCUMENTATION
      - IMPLEMENTATION
      - VERIFICATION
      - AUTOMATION
    include:
      - "ptsip.yaml"
      - "AGENTS.md"
      - ".github/workflows/governance.yml"
      - ".github/workflows/tooling-test.yml"
      - ".github/workflows/registry-sdk-issue-routing.yml"
      - ".github/workflows/sctool-authoring-sdk-regression.yml"
      - ".github/workflows/registry-client-sdk-regression.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/registry-sdk-issue-queue.json"
      - "tools/issue-routing/**"
      - "docs/index.yaml"
      - "docs/agent/**"
      - "docs/rules/**"
      - "docs/template/**"
      - "docs/responsibility/**"
      - "docs/ver*/**"
      - ".gitignore"
      - ".vscode/settings.json"
    purpose: repository_architecture_declaration_flat_machine_governance_and_validation_engine
    shipped: false
    runtime_required: false
    executable: true
    release_owner: development-tooling
    compatibility_owner: development-tooling
    manifests:
      - "tools/issue-routing/requirements.txt"

relationships:
  - id: registry-contracts-specify-catalog
    from: registry-contracts
    to: registry-catalog
    type: SPECIFIES

  - id: registry-contracts-specify-client-sdk
    from: registry-contracts
    to: registry-client-sdk
    type: SPECIFIES

  - id: registry-client-sdk-reads-catalog
    from: registry-client-sdk
    to: registry-catalog
    type: READS

  - id: registry-contracts-specify-sdk-package-delivery
    from: registry-contracts
    to: registry-sdk-package-delivery
    type: SPECIFIES

  - id: registry-sdk-package-delivery-publishes-client-sdk
    from: registry-sdk-package-delivery
    to: registry-client-sdk
    type: PUBLISHES

  - id: registry-contracts-specify-authoring-sdk-package-delivery
    from: registry-contracts
    to: authoring-sdk-package-delivery
    type: SPECIFIES

  - id: authoring-sdk-package-delivery-publishes-sctool-sdk
    from: authoring-sdk-package-delivery
    to: sctool-authoring-sdk
    type: PUBLISHES

  - id: authoring-sdk-package-delivery-publishes-repository-tool-sdk
    from: authoring-sdk-package-delivery
    to: repository-tool-authoring-sdk
    type: PUBLISHES

  - id: registry-contracts-specify-pages-delivery
    from: registry-contracts
    to: registry-pages-delivery
    type: SPECIFIES

  - id: registry-pages-delivery-reads-catalog
    from: registry-pages-delivery
    to: registry-catalog
    type: READS

  - id: registry-pages-delivery-publishes-catalog
    from: registry-pages-delivery
    to: registry-catalog
    type: PUBLISHES

  - id: product-documentation-documents-catalog
    from: product-documentation
    to: registry-catalog
    type: DOCUMENTS

  - id: product-documentation-documents-contracts
    from: product-documentation
    to: registry-contracts
    type: DOCUMENTS

  - id: product-documentation-documents-sctool-authoring-sdk
    from: product-documentation
    to: sctool-authoring-sdk
    type: DOCUMENTS

  - id: product-documentation-documents-repository-tool-authoring-sdk
    from: product-documentation
    to: repository-tool-authoring-sdk
    type: DOCUMENTS

  - id: repository-governance-governs-policy-automatic-engine
    from: repository-governance
    to: policy-automatic-engine
    type: GOVERNS

  - id: policy-automatic-engine-reads-repository-governance
    from: policy-automatic-engine
    to: repository-governance
    type: READS

  - id: repository-governance-governs-catalog
    from: repository-governance
    to: registry-catalog
    type: GOVERNS

  - id: repository-governance-governs-client-sdk
    from: repository-governance
    to: registry-client-sdk
    type: GOVERNS

  - id: repository-governance-governs-sctool-authoring-sdk
    from: repository-governance
    to: sctool-authoring-sdk
    type: GOVERNS

  - id: repository-governance-governs-repository-tool-authoring-sdk
    from: repository-governance
    to: repository-tool-authoring-sdk
    type: GOVERNS

  - id: repository-governance-governs-authoring-sdk-package-delivery
    from: repository-governance
    to: authoring-sdk-package-delivery
    type: GOVERNS

  - id: repository-governance-governs-contracts
    from: repository-governance
    to: registry-contracts
    type: GOVERNS

  - id: repository-governance-governs-sdk-package-delivery
    from: repository-governance
    to: registry-sdk-package-delivery
    type: GOVERNS

  - id: repository-governance-governs-pages-delivery
    from: repository-governance
    to: registry-pages-delivery
    type: GOVERNS

component_dependency_policy:
  default: deny
  allow:
    - from: repository-governance
      to: policy-automatic-engine
    - from: registry-pages-delivery
      to: policy-automatic-engine

policies:
  product_to_nonproduct_runtime_dependency: deny
  nonproduct_in_product_package: deny
  independent_build_resolution: required
  shared_executable_cross_lifecycle: deny
  neutral_contract_sharing: allow
