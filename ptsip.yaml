ptsip:
  version: "0.3.6-draft"
  specification:
    source: "https://github.com/Kinirin/PTSIP"
    revision: "d6995ed232e845b88d8235b851e80ab54b7804ea"

responsibility_map:
  mode: explicit

components:
  - id: registry-catalog
    classification: PRODUCT
    roles:
      - CONFIGURATION
    include:
      - "registry.json"
    purpose: public_sctool_package_discovery_and_runtime_registry_index
    shipped: true
    runtime_required: true
    executable: false
    release_owner: registry
    compatibility_owner: registry

  - id: registry-client-sdk
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "packages/registry-client-sdk/**"
    purpose: simple_connection_runtime_registry_metadata_access_delivery_and_integrity_client_sdk
    shipped: true
    runtime_required: true
    executable: true
    release_owner: registry-client-sdk
    compatibility_owner: registry-contract
    manifests:
      - "packages/registry-client-sdk/package.json"
    analysis_inputs:
      - "schemas/package.schema.json"
      - "policy/registry-policy.json"
      - "docs/REGISTRY_CONTRACT_V2.md"
      - "docs/REGISTRY_ACCESS_V1.md"
      - "docs/ARTIFACT_DELIVERY_V1.md"

  - id: registry-contracts
    classification: NEUTRAL_CONTRACT
    roles:
      - CONFIGURATION
      - GOVERNANCE
      - DOCUMENTATION
    include:
      - "schemas/*.schema.json"
      - "policy/registry-policy.json"
      - "docs/REGISTRY_CONTRACT_V1.md"
      - "docs/REGISTRY_CONTRACT_V2.md"
      - "docs/REGISTRY_ACCESS_V1.md"
      - "docs/ARTIFACT_DELIVERY_V1.md"
      - "docs/PAGES_DISTRIBUTION_V1.md"
      - "trust/**"
    purpose: canonical_registry_submission_distribution_trust_integrity_and_admission_contracts
    shipped: true
    runtime_required: false
    executable: false
    release_owner: registry-contract
    compatibility_owner: registry-contract

  - id: registry-pages-delivery
    classification: DELIVERY
    roles:
      - AUTOMATION
      - VERIFICATION
      - CONFIGURATION
    include:
      - ".github/workflows/pages.yml"
      - ".github/workflows/sign-trust.yml"
      - "tools/**"
    purpose: signed_registry_snapshot_assembly_root_trust_signing_verification_key_bootstrap_and_github_pages_publication
    shipped: false
    runtime_required: false
    executable: true
    release_owner: delivery
    compatibility_owner: registry-contract
    manifests:
      - "tools/package.json"
      - "tools/requirements.txt"
    analysis_inputs:
      - "registry.json"
      - "packages/**"
      - "publishers/**"
      - "schemas/**"
      - "policy/**"
      - "trust/**"
      - "ptsip.yaml"

  - id: product-documentation
    classification: PRODUCT
    roles:
      - DOCUMENTATION
    include:
      - "README.md"
      - "packages/README.md"
      - "publishers/README.md"
    purpose: public_registry_usage_package_and_publisher_documentation
    shipped: true
    runtime_required: false
    executable: false
    release_owner: registry
    compatibility_owner: registry

  - id: repository-governance
    classification: DEVELOPMENT_TOOLING
    roles:
      - CONFIGURATION
      - GOVERNANCE
      - DOCUMENTATION
      - IMPLEMENTATION
      - VERIFICATION
      - AUTOMATION
    include:
      - "ptsip.yaml"
      - "AGENTS.md"
      - ".github/workflows/governance.yml"
      - "governance/**"
      - "docs/governance/**"
      - "docs/ver1.0.1/**"
      - ".gitignore"
      - ".vscode/settings.json"
    purpose: repository_architecture_declaration_machine_governance_and_validation_engine
    shipped: false
    runtime_required: false
    executable: true
    release_owner: development-tooling
    compatibility_owner: development-tooling
    manifests:
      - "governance/requirements.txt"

relationships:
  - id: registry-contracts-specify-catalog
    from: registry-contracts
    to: registry-catalog
    type: SPECIFIES

  - id: registry-contracts-specify-client-sdk
    from: registry-contracts
    to: registry-client-sdk
    type: SPECIFIES

  - id: registry-client-sdk-reads-catalog
    from: registry-client-sdk
    to: registry-catalog
    type: READS

  - id: registry-contracts-specify-pages-delivery
    from: registry-contracts
    to: registry-pages-delivery
    type: SPECIFIES

  - id: registry-pages-delivery-reads-catalog
    from: registry-pages-delivery
    to: registry-catalog
    type: READS

  - id: registry-pages-delivery-publishes-catalog
    from: registry-pages-delivery
    to: registry-catalog
    type: PUBLISHES

  - id: product-documentation-documents-catalog
    from: product-documentation
    to: registry-catalog
    type: DOCUMENTS

  - id: product-documentation-documents-contracts
    from: product-documentation
    to: registry-contracts
    type: DOCUMENTS

  - id: repository-governance-governs-catalog
    from: repository-governance
    to: registry-catalog
    type: GOVERNS

  - id: repository-governance-governs-client-sdk
    from: repository-governance
    to: registry-client-sdk
    type: GOVERNS

  - id: repository-governance-governs-contracts
    from: repository-governance
    to: registry-contracts
    type: GOVERNS

  - id: repository-governance-governs-pages-delivery
    from: repository-governance
    to: registry-pages-delivery
    type: GOVERNS

component_dependency_policy:
  default: deny

policies:
  product_to_nonproduct_runtime_dependency: deny
  nonproduct_in_product_package: deny
  independent_build_resolution: required
  shared_executable_cross_lifecycle: deny
  neutral_contract_sharing: allow
